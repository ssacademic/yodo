<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yodo</title>
<meta name="description" content="An outline you can tick off. Everything is a line; a line becomes a project the moment it gets parts.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F7F2E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yodo">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..600,0..100,0..1&family=Instrument+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE DESIGN SYSTEM.  Every colour, size, radius and space lives
   here and nowhere else. No value gets typed inline again.
   ============================================================ */
:root{
  /* paper */
  --bg:#F7F2E7; --paper:#FEFCF6;
  --ink:#2A241C; --dim:#585146; --faint:#756B5D;
  /* the quietest grey that still reads on a card, a column or a sheet (measured 4.6:1+) */
  --faint-s:#6C6356;
  --hair:#2a241c12; --guide:#2a241c0d;
  --acc:#C2611F; --acc-t:#AB551B; --late:#B0402F;

  /* space — a 4px scale, nothing off it */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:32px;

  /* radius */
  --r1:8px; --r2:14px; --r3:20px; --rp:999px;

  /* form */
  --hit:22px;            /* every circular control */
  --row:46px;            /* every row */
  --indent:18px;
  --caret-w:28px;  --caret-pull:8px;  --row-gap:18px;
  /* exactly where the tick's left edge lands. the cue and the tray both hang
     off this same line, so they can never drift apart again. */
  --body:calc(var(--caret-w) - var(--caret-pull) + var(--row-gap));
  /* where the title text begins — the cue hangs off this, since it is the
     title's own second line */
  --textx:calc(var(--body) + var(--hit) + var(--row-gap));

  /* breathing, by how far you are from where you're standing.
     elders get air. descendants get closeness. */
  --air-1:30px;          /* above an elder that holds things */
  --air-1s:10px;         /* above an elder that holds nothing */
  --air-2:14px;
  --air-3:2px;

  /* motion */
  --spring:cubic-bezier(.34,1.7,.5,1);
  --ease:cubic-bezier(.2,.9,.3,1);

  /* type */
  --fs:1; --ff:'Instrument Sans'; --fd:'Fraunces';
  --t-row:17px; --t-d1:18px; --t-d2:16.5px; --t-deep:15.5px;
  --t-mark:12.5px; --t-ctl:13px; --t-sub:13.5px;
}
[data-theme="light"]{--bg:#F7F7F8;--paper:#FFF;--ink:#1C1B1F;--dim:#56545A;--faint:#706E76;--faint-s:#67656C;
  --hair:#1c1b1f12;--guide:#1c1b1f0d;--acc-t:#AF571C}
[data-theme="dark"]{--bg:#15140F;--paper:#201F19;--ink:#EDE9DE;--dim:#A79F90;--faint:#868074;--faint-s:#A0998A;
  --hair:#ffffff14;--guide:#ffffff0d;--acc:#D98040;--acc-t:#D98040;--late:#E28270}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 44x44 is the floor for anything you tap. these overlays grow the reachable
   area without touching a single pixel of the drawing. */
.tick,.into,.caret,.ico,.back,.star{position:relative}
.tick::after,.into::after,.caret::after,
.ico::after,.back::after,.star::after{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100%,42px);height:max(100%,44px);border-radius:var(--rp)}
/* the caret sits right beside the tick, so it keeps its own width and only
   grows downward — otherwise the two overlays fight over the same pixels */
.caret::after{width:100%;height:44px}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ff),system-ui,sans-serif;
  font-size:calc(16px*var(--fs));-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;transition:background .35s,color .35s}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
::selection{background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--ink)}
[contenteditable="true"]{caret-color:var(--acc)}
/* iOS zooms the whole page when a focused field is under 16px */
.note:focus{font-size:16px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:var(--r1)}
main{width:100%;max-width:640px;padding:0 var(--s5) 180px;height:100dvh;overflow-y:auto;
  scroll-padding-top:calc(env(safe-area-inset-top) + 96px)}   /* what scrolls into view lands below the sticky header */
@media (min-width:700px) and (not (pointer:coarse)){
  html,body{height:auto;min-height:100%}
  main{height:auto;min-height:100dvh;overflow:visible}
}

/* ---------- head ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);
  margin:0 calc(-1 * var(--s5)) var(--s4);
  padding:calc(env(safe-area-inset-top) + var(--s3)) var(--s5) var(--s2);
  border-bottom:1px solid var(--hair)}
.bar1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s2)}
.bar1 .icons{display:flex;gap:var(--s2);justify-self:end}
.bar2{display:flex;align-items:center;gap:12px;margin-top:2px;min-height:30px}
.brand{font-family:var(--fd),Georgia,serif;font-variation-settings:'SOFT' 55,'WONK' 1;
  font-weight:400;font-size:calc(16px*min(var(--fs),1.12));letter-spacing:.055em;
  color:var(--faint);text-transform:lowercase;
  transition:color .25s}
.brand:hover{color:var(--dim)}
.back{width:30px;height:30px;border-radius:var(--rp);color:var(--dim);display:grid;
  place-items:center;font-size:16px;flex:none;transition:color .2s,background .2s,transform .16s var(--spring)}
.back:hover{color:var(--ink);background:var(--hair)}
.back:active{transform:scale(.88)}
.back.off{opacity:.25;pointer-events:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap;
  font-size:calc(13px*var(--fs));color:var(--faint)}
.crumbs button{color:var(--dim);padding:11px 2px;min-height:44px}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
.crumbs .sep{opacity:.4}
.ico{width:32px;height:32px;border-radius:var(--rp);color:var(--faint);display:grid;
  place-items:center;font-size:14px;flex:none;transition:color .2s,background .2s}
.ico:hover{color:var(--ink);background:var(--hair)}
h1{font-family:var(--fd),Georgia,serif;font-variation-settings:'SOFT' 55,'WONK' 1;
  text-wrap:balance;font-weight:600;font-size:calc(26px*var(--fs));letter-spacing:-.024em;line-height:1.14;
  margin:0 0 var(--s4);outline:none;color:var(--ink)}

/* ---------- tree ---------- */
.kids .kids{margin-left:8px;padding-left:var(--indent);position:relative;
  padding-top:var(--s1);padding-bottom:var(--s2)}
.kids .kids::before{content:'';position:absolute;left:0;top:0;bottom:6px;width:1px;background:var(--guide)}
.kids .kids .kids .kids .kids .kids{margin-left:0;padding-left:8px}
.kids .kids .kids .kids .kids .kids .kids .kids .kids{padding-left:0}

.row{display:flex;align-items:flex-start;gap:var(--row-gap);min-height:var(--row);
  padding:var(--s2) 0;transition:opacity .35s}

/* ---- sectioning. an elder that holds things reads as a heading. ---- */
.d1{margin-top:var(--air-1s)}
/* every branch gets a line above it and room to breathe.
   so does the first loose line after a branch ends. */
.d1.holds,
.d1.holds + .d1:not(.holds){
  border-top:1px solid var(--hair);
  margin-top:var(--air-1);
  padding-top:var(--s3);
}
.d1.holds>.row{padding-bottom:var(--s1)}
.d1:first-child{margin-top:0;border-top:none;padding-top:0}
.d2{margin-top:0}
.d2.holds{margin-top:var(--air-2)}
.d3,.d4{margin-top:var(--air-3)}
.d3>.row,.d4>.row{padding:5px 0;min-height:36px}
.d2>.row{padding:7px 0;min-height:42px}

/* the guide fades as it goes deeper — closeness, not a cage */
.kids .kids::before{background:linear-gradient(var(--guide),transparent 92%)}
.d2 .kids::before{opacity:.6}
.d3 .kids::before{opacity:.35}

.caret{width:var(--caret-w);height:34px;flex:none;display:grid;place-items:center;color:var(--dim);
  font-size:18px;transition:transform .2s var(--ease),color .2s,background .2s;
  opacity:1;margin-left:calc(-1 * var(--caret-pull));border-radius:var(--rp)}
.caret:hover{background:var(--hair);color:var(--ink)}
.caret:hover{color:var(--ink)}
.caret.open{transform:rotate(90deg)}
.caret.none{visibility:hidden}

/* CIRCLE. one size, from the system. */
.tick{width:var(--hit);height:var(--hit);flex:none;margin-top:2px;border-radius:var(--rp);
  border:1.5px solid var(--faint);display:grid;place-items:center;
  transition:transform .18s var(--spring),background .2s,border-color .2s}
.tick svg{width:11px;height:11px;stroke:var(--paper);stroke-width:2.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;
  transition:stroke-dashoffset .22s ease .04s}
.tick:hover{border-color:var(--dim)}
.tick:active{transform:scale(.82)}

/* EVERY row has a way in. leaf = a dot. parent = a ring and a count.
   this is how a to-do becomes a project. */
.into{display:flex;align-items:center;gap:var(--s1);flex:none;color:var(--faint);
  margin-top:1px;padding:2px 0 2px 3px;transition:color .2s,transform .18s var(--spring)}
.into:hover{color:var(--acc)}
.into:active{transform:scale(.88)}
.into .n{font-size:calc(var(--t-mark)*var(--fs));font-variant-numeric:tabular-nums}
.into svg{width:18px;height:18px;display:block}
.into .prog{transform:rotate(-90deg)}
.into circle{fill:none;stroke-width:2.4}
.into .bg{stroke:currentColor;opacity:.3}
.into .fg{stroke:var(--acc);transition:stroke-dashoffset .5s var(--ease)}
.into .dot{fill:currentColor;opacity:.55;stroke:none}
.into:hover .dot{opacity:1}

/* depth changes SIZE only. never colour — an urgent thing three levels
   down must not look like the least important thing on screen. */
/* title and marks share one wrapping line. the title has a floor, so it can
   never be squeezed into a vertical column of letters. */
.main{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;
  column-gap:12px;row-gap:2px}
.t{flex:1 1 auto;min-width:min(15ch,45vw);outline:none;overflow-wrap:anywhere;min-height:1.4em;
  text-wrap:pretty;
  font-size:calc(var(--t-row)*var(--fs));line-height:1.36;letter-spacing:-.005em}
.t[contenteditable="true"]:empty::before{content:'\200b'}
.d1>.row .t{font-size:calc(var(--t-d1)*var(--fs));font-weight:500}
.d1.holds>.row .t{font-size:calc(20px*var(--fs));font-weight:600;letter-spacing:-.018em}
.d2>.row .t{font-size:calc(var(--t-d2)*var(--fs))}
.d2.holds>.row .t{font-weight:500}
.d3>.row .t,.d4>.row .t{font-size:calc(var(--t-deep)*var(--fs));letter-spacing:0}

/* a date changes the LINE */
.row.today .t{font-weight:500}
.row.late .t{color:var(--late)}

.note{padding:0 44px 0 var(--textx);margin-top:0;font-size:calc(12.5px*var(--fs));color:var(--faint);
  line-height:1.4;outline:none;max-width:52ch;overflow-wrap:anywhere}
/* a line that carries a cue gives up its own bottom padding, so the cue sits
   close to its parent — but never close to the marks that wrapped above it. */
.hasnote>.row{padding-bottom:1px}
.hasnote>.row .marks{margin-bottom:5px}
.note:focus{color:var(--dim)}
.note::before{opacity:.7}
.note:empty{display:none}
.note[data-ph]:empty{display:block}
.note[data-ph]:empty{font-size:calc(15px*var(--fs));color:var(--dim)}
.note[data-ph]:empty::before{content:'where will you be when you do this?';color:var(--dim)}
.note::before{content:'\21B3\00a0\00a0';color:var(--faint)}

.note.edit{color:var(--ink)}
.d3 .note,.d4 .note{font-size:calc(11.8px*var(--fs))}
.done>.note{opacity:.34}

.marks{display:flex;align-items:center;gap:16px;flex:0 0 auto;margin-top:0}
.marks:empty{display:none}
.mk{font-size:calc(var(--t-mark)*var(--fs));color:var(--faint);white-space:nowrap}
.mk.today{color:var(--acc-t);font-weight:500}
.mk.late{color:var(--late);font-weight:500}
.mk.rep::before{content:'↻ '}
.flags{display:inline-flex;align-items:center;gap:5px}
.mk.urg{color:var(--late);font-weight:500}
.mk.imp{color:var(--acc-t);font-weight:500}

.done>.row{opacity:.34}
.done>.row .t{text-decoration:line-through;text-decoration-thickness:1px}
.done>.row .tick{background:var(--acc);border-color:var(--acc)}
.done>.row .tick svg{stroke-dashoffset:0}

/* ---------- controls under the row ---------- */
.ctl{padding:2px 0 var(--s3) var(--body);animation:fade .2s var(--ease);position:relative}
.shut{position:absolute;right:5px;top:-34px;width:34px;height:34px;border-radius:var(--rp);
  color:var(--faint);display:grid;place-items:center;font-size:13px;background:var(--hair);
  transition:color .2s,background .2s}
.shut::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:var(--rp)}
.shut:hover{color:var(--ink);background:#2a241c1a}
.ctl .line{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ctl .line+.line{margin-top:6px}
.foot .key{color:var(--dim);font-weight:500}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.cb{padding:12px 10px;border-radius:var(--rp);min-height:44px;display:inline-flex;
  align-items:center;font-size:calc(var(--t-ctl)*var(--fs));
  color:var(--dim);background:var(--hair);white-space:nowrap;
  transition:background .16s,color .16s,transform .14s var(--spring)}
.cb:active{transform:scale(.93)}
.cb:hover{color:var(--ink)}
.cb.set{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc-t)}
.cb.set.urg{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}
.cb.set.late{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}
.cb.sym{padding:12px 13px;font-size:14px;line-height:1}
.pad{display:flex;background:var(--hair);border-radius:var(--rp);flex:none;
  align-items:stretch}
.pad button:first-child{border-radius:var(--rp) 0 0 var(--rp)}
.pad button:last-child{border-radius:0 var(--rp) var(--rp) 0}
.pad button{padding:13px 12px;line-height:0;color:var(--dim);min-height:44px;min-width:42px;
  display:flex;align-items:center;justify-content:center;
  transition:background .16s,color .16s}
.mv{width:20px;height:15px;display:block;fill:currentColor;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mv path{fill:none}
.pad button[aria-label="Up"] .mv,.pad button[aria-label="Down"] .mv{width:14px;height:19px}
.pad button:hover{background:#2a241c14;color:var(--ink)}
.pad button:active{background:#2a241c22}
.pad .sp{width:1px;background:#2a241c14;flex:none}
.pad .bin{font-size:13px;color:var(--faint)}
.pad .bin:hover{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}

.cb.del{color:var(--late);background:transparent;padding:12px 12px;margin-left:auto}
.cbv{margin-left:5px;font-size:.92em}
.sw{width:13px;height:13px;border-radius:var(--rp);display:inline-block;vertical-align:-2px}
.sw.none{border:1.5px solid var(--faint);background:transparent}
.opt.hue{display:flex;align-items:center;gap:8px;text-transform:capitalize}
.cb.del:hover{background:color-mix(in srgb,var(--late) 12%,transparent)}
.cb.x{background:transparent;color:var(--faint);padding:12px 12px;font-size:13px}

.opening{color:var(--dim);font-size:calc(15px*var(--fs));line-height:1.65;
  max-width:34ch;margin:0 0 var(--s5)}
.ghost{display:flex;align-items:center;gap:var(--row-gap);padding:var(--s4) 0;min-height:48px;cursor:text;
  opacity:.45;transition:opacity .2s}
.ghost:hover{opacity:.9}
.ghost .g{width:var(--hit);margin-left:var(--body);display:grid;place-items:center;flex:none}
.ghost .g i{width:5px;height:5px;border-radius:var(--rp);background:var(--faint);display:block}
.ghost span{font-size:calc(16px*var(--fs));color:var(--faint)}

/* ---------- mode toggle ---------- */
.modes{display:flex;background:var(--hair);border-radius:var(--rp);padding:2px;flex:none}
.modes button{padding:11px 16px;border-radius:var(--rp);min-height:44px;
  font-size:calc(12.5px*min(var(--fs),1.12));
  color:var(--dim);letter-spacing:.02em;transition:background .22s,color .22s}
.modes button:focus-visible{outline-offset:-3px;outline-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.modes button.on{background:var(--paper);color:var(--ink);
  box-shadow:0 1px 3px #2a241c1a;font-weight:500}

/* ---------- DO: chronological, check-off only ---------- */
.theone{position:relative;background:var(--paper);border-radius:var(--r3);padding:var(--s5) var(--s5) var(--s4);
  margin:var(--s4) 0 var(--s2);box-shadow:0 10px 30px -14px rgba(42,36,28,.35),0 1px 2px rgba(42,36,28,.06);
  border-top:3px solid var(--acc)}
.theone .lead{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc-t);
  margin-bottom:var(--s3)}
.theone .oanc{font-size:calc(11px*var(--fs));color:var(--faint);letter-spacing:.05em;margin-bottom:5px}
.theone .otitle{font-family:var(--fd),Georgia,serif;font-variation-settings:'SOFT' 55,'WONK' 1;
  font-weight:600;font-size:calc(24px*var(--fs));letter-spacing:-.024em;line-height:1.22;
  text-wrap:balance}
.theone .ocue{margin-top:var(--s2);font-size:calc(14px*var(--fs));color:var(--dim)}
.theone .owhy{margin-top:var(--s3);font-size:calc(13px*var(--fs));color:var(--faint);font-style:italic}
.theone .oact{display:flex;gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap;align-items:center}
.cb.pin{font-size:calc(12.5px*var(--fs));color:var(--faint);background:transparent;padding:7px 10px}
.cb.pin:hover{color:var(--acc-t);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.cb.pin.on{color:var(--acc-t);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.theone .pinned{font-size:calc(11px*var(--fs));color:var(--acc-t);letter-spacing:.1em;
  text-transform:uppercase;margin-top:var(--s2)}
.go.big{padding:11px 22px;font-size:calc(14.5px*var(--fs))}

.lens{display:flex;gap:2px;background:var(--hair);border-radius:var(--rp);padding:2px;
  width:fit-content;flex:none}
.dobar{display:flex;align-items:center;gap:8px;margin:var(--s2) 0 0;min-width:0}
.scope{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 12px;min-width:0;
  border-radius:var(--rp);font-size:calc(12.5px*var(--fs));color:var(--dim);flex:0 1 auto}
.scope .sl{color:var(--faint)}
.scope .sv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9.5em}
.scope .sc{font-size:10px;color:var(--faint)}
.scope.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc-t)}
.scope.on .sl,.scope.on .sc{color:var(--acc-t)}
.scopelist{display:flex;flex-direction:column}
.scopeopt{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;text-align:left;
  border-radius:var(--r2);font-size:calc(15px*var(--fs));color:var(--ink)}
.scopeopt .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scopeopt .sn{font-size:calc(12.5px*var(--fs));color:var(--faint)}
.scopeopt.on{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc-t);font-weight:500}
.ohide{position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:50%;
  color:var(--faint);font-size:13px;display:grid;place-items:center}
.ohide:hover{background:var(--hair);color:var(--ink)}
.onehid{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  min-height:44px;margin:var(--s4) 0 var(--s2);padding:0 var(--s4);border-radius:var(--r2);
  background:var(--hair);font-size:calc(12.5px*var(--fs));color:var(--dim);text-align:left}
.onehid b{color:var(--acc-t);font-weight:500}
/* ---------- Do: today's rows are flat; tap for choices ---------- */
.dodate{font-size:calc(13px*var(--fs));color:var(--faint);margin-right:auto}
.dlist{display:flex;flex-direction:column;margin-top:var(--s3)}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:start;padding:var(--s3) 2px;
  border-bottom:1px solid var(--hair);cursor:pointer;border-radius:var(--r1);transition:background .15s,opacity .3s}
.drow:last-child{border-bottom:none}
.drow:hover{background:var(--hair)}
.drow .tick{margin-top:2px}
.dmain{min-width:0}
.dcrumb{font-size:calc(11.5px*var(--fs));color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtx{font-size:calc(17px*var(--fs));line-height:1.35;overflow-wrap:anywhere}
.dcue{font-size:calc(13px*var(--fs));color:var(--faint);margin-top:2px}
.dmk{display:flex;gap:8px;align-items:center;font-size:calc(12.5px*var(--fs));padding-top:3px;flex-wrap:wrap;justify-content:flex-end;max-width:9em}
.drow.done{opacity:.4}.drow.done .dtx{text-decoration:line-through;text-decoration-thickness:1px}
.drow.late .dtx{color:var(--late)}
.door{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;
  margin:var(--s5) 0 0;padding:var(--s3) var(--s4);border-radius:var(--r2);background:var(--hair);
  font-size:calc(13px*var(--fs));color:var(--dim);text-align:left}
.leafhere{margin-top:var(--s4);padding:var(--s4);border-radius:var(--r2);background:var(--hair);font-size:calc(14px*var(--fs));color:var(--dim)}
.leafhere p{margin-bottom:var(--s3)}
.door b{color:var(--acc-t);font-weight:500;white-space:nowrap}
.qadd{display:flex;gap:8px;margin:var(--s4) 0 0;max-width:560px}
.qadd input{flex:1;min-width:0;background:transparent;border:1px dashed color-mix(in srgb,var(--faint) 55%,transparent);
  border-radius:var(--r2);padding:11px 14px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.qadd input:focus{border-style:solid;border-color:var(--acc);background:var(--paper)}
.qadd input::placeholder{color:var(--faint)}
.opt.go1{background:var(--acc);color:#fff}
/* on a surface (a card, a column, a sheet) the quiet grey steps up one notch so it
   still clears 4.5:1; on the page itself the original grey already does */
.pcol,.pquad,.pcard,.sin,.theone,.pdone{--faint:var(--faint-s)}
/* ---------- Plan ---------- */
main{max-width:1400px}
body:not(.wide) main>:not(.top),body:not(.wide) .bar2{max-width:596px;margin-left:auto;margin-right:auto;width:100%}
.pbar{flex-wrap:wrap}
.plede{font-size:calc(12.5px*var(--fs));color:var(--faint);margin:var(--s2) 0 0}
.pboard{display:flex;gap:var(--s3);overflow-x:auto;align-items:flex-start;margin-top:var(--s4);padding-bottom:var(--s3)}
.pcol{flex:1 1 0;min-width:150px;max-width:340px;display:flex;flex-direction:column;border-radius:var(--r3);
  background:var(--hair);padding:var(--s3) var(--s2) var(--s2);min-height:170px;transition:background .15s,box-shadow .15s}
.pcol.focus{background:var(--paper);box-shadow:0 10px 30px -16px rgba(42,36,28,.35),0 0 0 1px var(--hair)}
.pcol.rail{flex:1.15 1 0;min-width:170px;background:transparent;border:1px dashed color-mix(in srgb,var(--faint) 45%,transparent)}
.pcol.rail.tray-folded{flex:0 0 auto;min-width:0;min-height:0;padding-bottom:var(--s3)}
.pcol.late .ph h2{color:var(--late)} .pcol.focus .ph h2{color:var(--acc-t)}
.pcol.slotted{flex-grow:1.2;padding-bottom:var(--s3)}
.pover{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 50%,transparent)!important;
  background:color-mix(in srgb,var(--acc) 10%,var(--hair))!important}
.ph{display:flex;align-items:baseline;gap:var(--s2);padding:0 var(--s2) var(--s2)}
.ph h2{font-family:var(--fd),Georgia,serif;font-variation-settings:'SOFT' 55,'WONK' 1;font-size:calc(16px*var(--fs));font-weight:500}
.ph .d{font-size:calc(12px*var(--fs));color:var(--faint)} .ph .n{margin-left:auto;font-size:calc(12px*var(--fs));color:var(--faint);font-variant-numeric:tabular-nums}
.ptoggle{font-size:calc(12px*var(--fs));color:var(--acc-t);padding:4px 8px;border-radius:var(--rp);min-height:32px}
.pact{margin:0 var(--s2) var(--s2);font-size:calc(12.5px*var(--fs));color:var(--late);text-align:left;padding:6px 0;min-height:32px}
.pslot{border-radius:var(--r2);padding:6px 4px 8px}
.pslot+.pslot{border-top:1px solid var(--hair);border-radius:0}
.psh{display:flex;align-items:baseline;gap:6px;padding:2px 6px 6px;font-size:calc(12.5px*var(--fs));color:var(--faint)}
.psh b{font-weight:600;color:var(--dim)} .psh .n{margin-left:auto}
.pfree{font-size:calc(12px*var(--fs));color:var(--faint);padding:2px 6px}
.pcards{display:flex;flex-direction:column;gap:6px;min-height:40px;flex:1}
.pslot .pcards{min-height:0}
.pempty{font-size:calc(12.5px*var(--fs));color:var(--faint);padding:var(--s3) var(--s2);border-radius:var(--r2);
  border:1px dashed var(--hair);text-align:center}
.plimit{display:flex;align-items:center;gap:8px;font-size:calc(11.5px*var(--fs));color:var(--faint);padding:4px var(--s2)}
.plimit::before,.plimit::after{content:"";flex:1;height:1px;background:var(--hair)}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--paper);border-radius:var(--r2);
  padding:10px 12px 10px 10px;box-shadow:0 1px 2px rgba(42,36,28,.08),0 6px 18px -12px rgba(42,36,28,.28);
  cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;position:relative}
.pcol.focus .pcard{box-shadow:0 0 0 1px var(--hair)}
.pcard.compact{padding:7px 10px 7px 9px;box-shadow:0 0 0 1px var(--hair)}
.pcard.compact .pcue{display:none}
.pcard.proj .pt{font-weight:500}
.pcard.dragging{opacity:.3}
.pcard.armed{transform:scale(.98)}
.pghost{position:fixed;z-index:80;pointer-events:none;transform:rotate(2deg);opacity:.97;
  box-shadow:0 14px 34px -12px rgba(42,36,28,.45),0 0 0 1px var(--hair)}
.ptick{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--faint);margin-top:1px;position:relative;flex:none}
.ptick::after{content:"";position:absolute;inset:-12px}
.ptick:hover{border-color:var(--acc)}
.ptx{min-width:0}
.pcr{font-size:calc(11.5px*var(--fs));color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.pt{font-size:calc(14.5px*var(--fs));overflow-wrap:anywhere}
.pcue{font-size:calc(12.5px*var(--fs));color:var(--faint);margin-top:2px}
.pmk{display:flex;gap:8px;margin-top:4px;font-size:calc(12px*var(--fs));flex-wrap:wrap}
.mk.soft{color:var(--faint)}
.pparts{display:flex;flex-direction:column;gap:2px;margin-top:6px;border-top:1px solid var(--hair);padding-top:6px}
.ppart{text-align:left;font-size:calc(13px*var(--fs));color:var(--dim);padding:5px 6px;border-radius:var(--r1);min-height:32px;overflow-wrap:anywhere}
.ppart::before{content:'\2022\00a0\00a0';color:var(--faint)}
.ppart:hover{background:var(--hair);color:var(--ink)}
.mk.new{color:var(--acc-t);font-weight:600;font-size:calc(10.5px*var(--fs));letter-spacing:.09em;text-transform:uppercase}
.pcard.fresh{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--acc) 55%,transparent),0 6px 18px -12px rgba(42,36,28,.28)}
.pcard.flash{animation:pflash 1.8s var(--ease)}
@keyframes pflash{0%,25%{background:color-mix(in srgb,var(--acc) 22%,var(--paper))}100%{background:var(--paper)}}
@media (prefers-reduced-motion:reduce){.pcard.flash{animation:none}}
.pmore{font-size:calc(12px*var(--fs));color:var(--faint);padding:2px 6px}
.pnotes{display:flex;align-items:baseline;gap:6px;width:100%;text-align:left;margin-top:var(--s2);padding:8px 6px;min-height:40px;
  border-top:1px dashed color-mix(in srgb,var(--faint) 45%,transparent);font-size:calc(13px*var(--fs));color:var(--dim);font-weight:500}
.pnotes .pna{width:1em;color:var(--faint)}
.pnotes .n{font-size:calc(12px*var(--fs));color:var(--faint);font-variant-numeric:tabular-nums}
.pnotes .pnw{margin-left:auto;font-size:calc(12px*var(--fs));color:var(--faint);font-weight:400}
.pnotes:hover{color:var(--ink)}
.fsrow{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.fsrow input{flex:1;min-width:0;accent-color:var(--acc);height:32px}
.fsrow .opt{min-width:44px;padding:8px 0;text-align:center}
.fsrow .fsdn{font-size:12px}.fsrow .fsup{font-size:19px}
.fsv{font-weight:400;color:var(--faint);margin-left:6px}
.pmatrix{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4);align-items:start}
.pquad{border-radius:var(--r3);background:var(--hair);padding:var(--s3) var(--s2) var(--s2);min-height:170px;display:flex;flex-direction:column}
.pquad .pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));align-content:start;max-height:56vh;overflow:auto;padding:2px}
.pquad.q1{background:var(--paper);box-shadow:0 10px 30px -16px rgba(42,36,28,.35),0 0 0 1px var(--hair)}
.pquad.q1 h2{color:var(--late)} .pquad.q2 h2{color:var(--acc-t)}
.pwhy{font-size:calc(12px*var(--fs));color:var(--faint);padding:0 var(--s2) var(--s2);margin-top:-4px}
.pdone{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s5)}
.pdone h3{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-right:var(--s2)}
.pchip{font-size:calc(13px*var(--fs));color:var(--faint);text-decoration:line-through;padding:6px 12px;border-radius:var(--rp);background:var(--hair);min-height:36px}
.pdone .none{font-size:calc(13px*var(--fs));color:var(--faint)}
html.plock,html.plock body,html.plock main{overflow:hidden!important;overscroll-behavior:none}
html.plock .pcard{touch-action:none}
@media (max-width:760px){
  .pboard{flex-direction:column;overflow:visible}
  .pcol,.pcol.rail,.pcol.slotted{flex:none;width:100%;min-width:0;max-width:none;min-height:0}
  .pmatrix{grid-template-columns:1fr}
}
.dcue,.pcue,.dtx,.pt,.theone,.sin h3,.door span{overflow-wrap:anywhere;min-width:0}
.dostep{font-size:calc(10.5px*var(--fs));letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.cb.showall{margin-top:var(--s4);font-size:calc(13px*var(--fs));color:var(--acc-t);
  background:color-mix(in srgb,var(--acc) 12%,transparent);padding:10px 16px}
.lens button{padding:11px 16px;border-radius:var(--rp);min-height:44px;
  font-size:calc(12.5px*var(--fs));
  color:var(--dim);transition:background .22s,color .22s}
.lens button.on{background:var(--paper);color:var(--ink);font-weight:500;box-shadow:0 1px 3px #2a241c1a}
.band{margin:var(--s6) 0 var(--s3)}
.band:first-child{margin-top:var(--s2)}
.bandbtn{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;text-align:left}
.band h2{font-family:var(--fd),Georgia,serif;font-weight:600;font-size:calc(15px*var(--fs));
  letter-spacing:.02em;color:var(--dim);text-transform:lowercase;margin:0}
.band .fold{color:var(--faint);font-size:11px;transition:transform .2s var(--ease);display:inline-block}
.band.folded .fold{transform:rotate(-90deg)}
.band .n{margin-left:auto;font-size:calc(12px*var(--fs));color:var(--faint);
  font-variant-numeric:tabular-nums}
.band.now h2{color:var(--acc-t)}
.band.late h2{color:var(--late)}

.doit{padding:var(--s3) 0 var(--s4);border-bottom:1px solid var(--hair);transition:opacity .35s}
.doit:last-child{border-bottom:none}
/* the roots, tiny and quiet — they say where it came from, nothing more */
.roots{display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  font-size:calc(11px*var(--fs));color:var(--faint);letter-spacing:.05em;
  margin-bottom:var(--s1);padding-left:33px}
.roots .r{opacity:.75}
.roots .r:last-child{opacity:1;color:var(--dim)}
.roots .s{opacity:.4}
.doline{display:flex;align-items:flex-start;gap:var(--s3)}
.dotext{flex:1;min-width:0;font-size:calc(18px*var(--fs));line-height:1.35;font-weight:400;
  letter-spacing:-.006em}
/* one line at a time can be brought forward. it is a spotlight, not a badge. */
.doit.lit{background:color-mix(in srgb,var(--acc) 7%,transparent);
  border-radius:var(--r2);padding-left:14px;padding-right:12px;margin:0 -14px;
  box-shadow:inset 3px 0 0 var(--acc)}
.doit.lit .dotext{font-weight:600;font-size:calc(21px*var(--fs));letter-spacing:-.018em}
.doit.lit .roots{padding-left:33px}
.lamp{padding:12px 12px;border-radius:var(--rp);background:var(--surf3,transparent);
  color:var(--faint);font-size:15px;line-height:1;min-height:44px;
  display:inline-flex;align-items:center;transition:color .2s,background .2s}
.lamp:hover{color:var(--acc-t);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.lamp.on{color:var(--acc-t);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.doit.done .dotext{text-decoration:line-through;text-decoration-thickness:1px}
.doit.done{opacity:.34}
.dometa{display:flex;align-items:center;gap:var(--s3);margin:var(--s2) 0 0 33px;flex-wrap:wrap}
.dodate{font-size:calc(12.5px*var(--fs));color:var(--faint)}
.dodate.late{color:var(--late);font-weight:500}
.dodate.today{color:var(--acc-t);font-weight:500}
.go{padding:13px 18px;border-radius:var(--rp);min-height:44px;display:inline-flex;
  align-items:center;font-size:calc(13px*var(--fs));font-weight:500;
  background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);
  transition:background .18s,transform .14s var(--spring)}
.go:active{transform:scale(.93)}
.donote{font-size:calc(13px*var(--fs));color:var(--dim);margin:var(--s1) 0 0 33px;max-width:52ch}
.dostar{color:#D9A400;font-size:13px}

/* ---------- focus ---------- */
#focus{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:var(--s5);padding:var(--s5)}
#focus.on{display:flex;animation:fin .35s var(--ease)}
@keyframes fin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#focus .froots{font-size:calc(11.5px*var(--fs));color:var(--faint);letter-spacing:.06em;text-align:center}
#focus .ftitle{font-family:var(--fd),Georgia,serif;font-weight:600;
  font-size:calc(28px*var(--fs));letter-spacing:-.025em;text-align:center;max-width:20ch;line-height:1.2}
.dial{position:relative;width:190px;height:190px;display:grid;place-items:center}
.dial svg{position:absolute;inset:0;width:190px;height:190px;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:5}
.dial .bg{stroke:var(--hair)}
.dial .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.dial b{font-size:calc(38px*var(--fs));font-weight:400;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
#focus .frow{display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center}
.fb{padding:12px 22px;border-radius:var(--rp);font-size:calc(14.5px*var(--fs));
  background:var(--hair);color:var(--dim);transition:background .18s,transform .14s var(--spring)}
.fb:active{transform:scale(.95)}
.fb.done{background:var(--acc);color:var(--paper);font-weight:500}

/* ---------- first run: a short introduction, then the real buttons ---------- */
#intro{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:var(--s5);
  text-align:center}
#intro.on{display:flex}
#intro .card{max-width:31ch;animation:fade .4s var(--ease)}
#intro .mark{font-size:34px;margin-bottom:var(--s4);color:var(--acc-t);line-height:1}
#intro h2{text-wrap:balance;font-family:var(--fd),Georgia,serif;font-variation-settings:'SOFT' 55,'WONK' 1;
  font-weight:600;font-size:calc(27px*var(--fs));letter-spacing:-.026em;line-height:1.18;
  margin-bottom:var(--s3)}
#intro p{color:var(--dim);font-size:calc(15.5px*var(--fs));line-height:1.65}
#intro .demo{margin:var(--s5) auto 0;text-align:left;width:fit-content;
  font-size:calc(14.5px*var(--fs));color:var(--dim);line-height:2}
#intro .demo b{color:var(--ink);font-weight:500}
#intro .demo .k{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--hair);
  padding:2px 6px;border-radius:5px;color:var(--ink)}
#intro .demo .ind{padding-left:26px}
#intro .foot2{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);
  display:flex;align-items:center;justify-content:center;gap:var(--s4);padding:0 var(--s5)}
#intro .dots{display:flex;gap:6px}
#intro .dots i{width:6px;height:6px;border-radius:var(--rp);background:var(--hair);transition:.25s}
#intro .dots i.on{background:var(--acc);width:18px}
#intro .skip{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:20px;
  color:var(--faint);font-size:calc(13.5px*var(--fs))}
.pill-btn{padding:12px 26px;border-radius:var(--rp);background:var(--acc);color:var(--paper);
  font-size:calc(15px*var(--fs));font-weight:500;transition:transform .15s var(--spring)}
.pill-btn:active{transform:scale(.95)}

/* coach marks: the real button, lit up, with a line about it */
#coach{position:fixed;inset:0;z-index:190;display:none}
#coach.on{display:block}
#spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,16,10,.62);
  transition:all .35s var(--ease);pointer-events:none}
#tip{position:absolute;max-width:270px;background:var(--paper);border-radius:16px;
  padding:15px 17px;box-shadow:0 14px 40px -12px rgba(20,16,10,.5);animation:fade .3s var(--ease)}
#tip h4{font-family:var(--fd),Georgia,serif;font-weight:600;font-size:calc(16px*var(--fs));
  letter-spacing:-.015em;margin-bottom:5px}
#tip p{font-size:calc(13.5px*var(--fs));color:var(--dim);line-height:1.55}
#tip .row2{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3)}
#tip .n{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
#tip button{margin-left:auto;padding:8px 16px;border-radius:var(--rp);background:var(--acc);
  color:var(--paper);font-size:calc(13px*var(--fs));font-weight:500}
#tip .later{background:transparent;color:var(--faint);margin-left:0;padding:8px 4px}

/* ---------- undo ---------- */
/* a word when you finish something. it drops in under the bar, centred,
   and leaves quickly — the undo lives at the bottom, so they never meet. */
#cheer{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 74px);z-index:60;
  display:flex;justify-content:center;pointer-events:none}
#cheer b{display:inline-block;background:var(--acc);color:var(--paper);
  border-radius:var(--rp);padding:9px 18px;font-size:calc(14.5px*var(--fs));font-weight:500;
  white-space:nowrap;opacity:0;transform:translateY(-12px) scale(.96);
  transition:.28s var(--spring);box-shadow:0 8px 22px -8px rgba(42,36,28,.55)}
#cheer.on b{opacity:1;transform:none}

#undo{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:70;
  background:var(--ink);color:var(--bg);border-radius:var(--rp);
  padding:11px var(--s2) 11px var(--s4);display:flex;align-items:center;gap:var(--s3);
  font-size:calc(14px*var(--fs));opacity:0;pointer-events:none;
  transition:.28s var(--spring);box-shadow:0 10px 30px -10px #2a241c66}
#undo.on{opacity:.97;transform:translate(-50%,0);pointer-events:auto}
#undo button{color:var(--acc-t);font-weight:500;padding:4px 10px;border-radius:var(--rp);white-space:nowrap;flex:none;
  background:#ffffff1a}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:#0006;display:none;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sin{width:100%;max-width:620px;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  background:var(--paper);border-radius:var(--r3) var(--r3) 0 0;
  padding:0 var(--s5) calc(env(safe-area-inset-bottom) + var(--s5));
  animation:up .3s var(--ease)}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.grip{width:36px;height:4px;border-radius:var(--rp);background:var(--hair);margin:0 auto var(--s3)}
.shead{position:sticky;top:0;z-index:5;background:var(--paper);

/* how far a row at this depth sits from the left. Deep levels indent less and

    if(!plain.trim()||(h.match(EMOg)||[]).length>(plain.match(EMOg)||[]).length)return h}

  if(has)toastLine('Yodo keeps words only. A picture can’t be pasted, but emoji can.');

    const tx=clipText(e.dataTransfer).replace(/\s*\n\s*/g,' ');if(!tx)return;

},true);
/* several lines pasted into a row become lines: indentation nests them, bullets
   and numbers are dropped, and "[x]" arrives ticked */
function pasteInto(e,el,node,parent){
  const cd=e.clipboardData||window.clipboardData;if(!cd)return;
  e.preventDefault();

  if(clipOnlyPicture(cd,raw))return;
  /* rows copied from Yodo itself carry their marks as separate lines of text;
     take only the titles. (A parsed document runs no scripts and loads nothing.) */
  const html=cd.getData('text/html')||'';
  if(/class="(?:t|dtx|pt|otitle)"/.test(html)){
    const doc=new DOMParser().parseFromString(html,'text/html');
    const ts=[...doc.querySelectorAll('.t,.dtx,.pt,.otitle')].map(x=>x.textContent.trim()).filter(Boolean);
    if(ts.length)raw=ts.join('\n');
  }
  const lines=raw.split('\n').filter(l=>l.trim()!=='');
  const clean=l=>{const ind=(l.match(/^[ \t]*/)[0]).replace(/\t/g,'    ').length;let t=l.trim(),done=false;
    const bx=t.match(/^[-*\u2022]?\s*\[([ xX])\]\s+/);if(bx){done=bx[1]!==' ';t=t.slice(bx[0].length)}
    t=t.replace(/^(?:[-*\u2022\u2023\u25E6\u00B7]|\d+[.)])\s+/,'');return {ind,t,done}};
  if(lines.length<=1){insertPlain(el,lines.length?clean(lines[0]).t:'');node.t=el.textContent;touch(node);saveSoon();return}
  const items=lines.map(clean);
  insertPlain(el,items[0].t);node.t=el.textContent;touch(node);
  const made=[];let last=node;const st=[{ind:items[0].ind,n:node}];
  items.slice(1).forEach(it=>{
    const nn=nd(it.t,[],it.done?{done:true,doneAt:Date.now()}:{});
    while(st.length>1&&it.ind<=st[st.length-1].ind)st.pop();
    const top=st[st.length-1];
    if(it.ind>top.ind){const sn=ordSnap(top.n);top.n.kids.push(nn);placeOrd(top.n,nn,sn);top.n.collapsed=false;st.push({ind:it.ind,n:nn})}

    made.push(nn);

  offerUndo('Pasted '+lines.length+' lines.',()=>{made.slice().reverse().forEach(m=>{const f=find(m.id);if(f)killNode(m,f.parent)})});

/* it asks; it never blocks. a task you cannot save is a task you will not write. */
function nudgeCue(node){
  if(!askCue||node.note)return;
  setTimeout(()=>{
    const nt=document.querySelector('.note[data-note="'+node.id+'"]');
    if(!nt)return;
    nt.focus();
    const r=document.createRange(),sel=getSelection();
    r.selectNodeContents(nt);r.collapse(false);sel.removeAllRanges();sel.addRange(r);

function ordSnap(parent){const m={};

  const j=parent.kids.indexOf(node);
  const pv=parent.kids[j-1], nx=parent.kids[j+1];
  const a=pv?(snap[pv.id]!=null?snap[pv.id]:(pv.ord!=null?pv.ord:0)):null;
  const b=nx?(snap[nx.id]!=null?snap[nx.id]:(nx.ord!=null?nx.ord:0)):null;
  const now=Date.now();
  if(a!=null&&b!=null){
    if(b-a>1e-6){node.ord=(a+b)/2;node.mv=now}
    else{parent.kids.forEach((k,i)=>{k.ord=i*1024;k.mv=now})}    /* moves only: no text is overruled */
  }else if(a!=null){node.ord=a+1024;node.mv=now}

function shift(node,parent,d){

/* ---------- outliner keyboard ---------- */
function key(e,node,parent){
  const i=parent.kids.indexOf(node);

    e.preventDefault();
    const sel=getSelection(), atStart = sel && sel.anchorOffset===0 && node.t;
    if(atStart){            /* open a line ABOVE; this one drops down with its parts */
      const snap=ordSnap(parent),f=nd('');
      parent.kids.splice(i,0,f);placeOrd(parent,f,snap);
      openId=node.id;render();focus(node.id);
    }else{
      const snap=ordSnap(parent),f=nd('');

/* ============================================================
   DO — everything with a date, in time order.
   You cannot restructure here. You can only finish things.
   The roots are shown small and quiet, purely so you know
   where a thing came from.
   ============================================================ */
function ancestry(id){
  return chain(id).slice(1,-1);      /* drop ROOT and the item itself */
}
/* anything you have marked in any way is fair game for Do.
   most things never get a date; that must not exclude them. */
/* What Do shows. A marked line without parts shows as itself. A marked line
   WITH parts shows as its next step: the first part still open, carrying the
   parent's day and flags, so a project marked "important, Friday" is never
   silently left out. When the next step is marked itself, the two merge into
   one entry carrying both. EFF holds the merged view; E(n) reads it. */
let EFF=new Map(), PATH=new Map();
const E=n=>EFF.get(n)||n;
function doPool(){
  EFF=new Map();PATH=new Map();const out=[],UP=new Map();
  /* up: the day of the nearest project above. A project's day covers its parts,
     so a part with no day of its own is due with its project (as Plan shows it) */
  (function walk(x,path,up){
    x.kids.forEach(k=>{
      if(!k.kids.length){
        if((marked(k)||EFF.has(k))&&(!isDone(k)||keepDone)){out.push(k);PATH.set(k,path);
          if(k.when==null&&up!=null){UP.set(k,up);if(!EFF.has(k))EFF.set(k,{via:[]})}}
        return;
      }
      if(isDone(k))return;
      if(marked(k)){const st=firstOpenLeaf(k);
        if(st){const e=EFF.get(st)||{via:[]};e.via.push(k);EFF.set(st,e)}}
      walk(k,path.concat(k.id),k.when!=null?k.when:up);
    });
  })(ROOT,[ROOT.id],null);
  EFF.forEach((e,leaf)=>{
    let ws=[leaf.when].concat(e.via.map(v=>v.when)).filter(w=>w!=null);
    if(!ws.length&&UP.has(leaf))ws=[UP.get(leaf)];
    e.when=ws.length?Math.min.apply(null,ws):null;
    e.urgent=!!(leaf.urgent||e.via.some(v=>v.urgent));
    e.imp=!!(leaf.imp||e.via.some(v=>v.imp));
    e.star=!!leaf.star;
  });
  return out;
}
function pickedUp(from){
  const all=doPool();
  if(!from||from===ROOT)return all;
  return all.filter(n=>(PATH.get(n)||[]).includes(from.id));
}
/* the branches worth offering: any line with parts that holds something Do would show */
function scopeChoices(){

  (function w(x,d){x.kids.forEach(k=>{

    const n=pickedUp(k).filter(z=>!isDone(z)).length;
    if(n){out.push({node:k,depth:d,n});if(d<3)w(k,d+1)}
  })})(ROOT,0);
  return out;
}

const BY_TIME=[
  ['late', 'overdue',   n=>E(n).when!=null&&dayOff(E(n).when)<0],
  ['now',  'today',     n=>E(n).when!=null&&dayOff(E(n).when)===0],

  ['later','later',     n=>E(n).when!=null&&dayOff(E(n).when)>=7],

const scopeNode=()=>here();

const CHEERS=[
  ['\u{1F389}','Done.'],           ['\u2728','Nice one.'],
  ['\u{1F44F}','Off your plate.'], ['\u{1F331}','Good.'],
  ['\u{1F3AF}','One down.'],       ['\u{1F44C}','Well done.'],

  cheerAt=now;

function finish(node){
  /* a repeating line is never "done": finishing it sends it to its next day,
     and the finish is counted under its own key so every round counts once */
  if(node.kids.length){
    /* a parent has no tick of its own. it is done when its parts are */
    if(isDone(node)){toastLine('Done because all its parts are. Untick a part to reopen it.');return}
    const open=[];(function w(x){x.kids.forEach(k=>{if(k.kids.length)w(k);else if(!k.done)open.push(k)})})(node);
    offerUndo(open.length+' part'+(open.length>1?'s':'')+' still open.','Tick all '+open.length,()=>{
      const now=Date.now();
      open.forEach(k=>{k.done=true;k.doneAt=now;k.pinned=false;tallyMark(k);touch(k)});
      buzz(14);cheerUp();save();render();
      setTimeout(()=>offerUndo('Ticked '+open.length+' part'+(open.length>1?'s':'')+'.',()=>{
        open.forEach(k=>{k.done=false;delete k.doneAt;tallyUnmark(k);touch(k)})}),60);
    });
    return;
  }
  node.done=!node.done;touch(node);
  if(node.done){node.doneAt=Date.now();node.pinned=false;tallyMark(node)}
  else{delete node.doneAt;tallyUnmark(node)}
  if(node.done){
    buzz(14);cheerUp();
    if(node.repeat&&!node.kids.length)
      toastLine('Done. The next one comes round '+longDay(nextRound(node))+'.');
    /* if it left the screen, it needs a way back — in either mode. */
    else if(!keepDone&&fullyDone(node))
      offerUndo('Taken off the list.','Bring it back',()=>{node.done=false;touch(node);save();render()});
  }
  save();
}

/* if you only do one thing. the rule is fixed and it says what it is. */
function theOne(pool){
  const late=n=>E(n).when!=null&&dayOff(E(n).when)<0;
  const today=n=>E(n).when!=null&&dayOff(E(n).when)===0;
  const chosen=pool.find(n=>n.pinned);
  if(chosen)return {node:chosen,why:'you chose it'};
  const U=n=>E(n).urgent, I=n=>E(n).imp;
  const rules=[
    [n=>late(n)&&U(n)&&I(n), 'it is overdue, urgent and important'],
    [n=>late(n)&&I(n),       'it is overdue, and it matters'],
    [n=>late(n),             'it is already late'],
    [n=>U(n)&&I(n),          'it is both urgent and important'],
    [n=>today(n)&&I(n),      'it is due today, and it matters'],
    [n=>today(n),            'it is due today'],
    [n=>U(n),                'it is marked urgent'],
    [n=>I(n),                'it is marked important'],
    [n=>E(n).when!=null,     'it has the nearest day on it']
  ];
  /* say when the reason is really the parent's */
  const viaWhy=(n,why)=>{const e=EFF.get(n);
    return e&&e.via.length?'it is the next step of \u201C'+short(e.via[0].t,30)+'\u201D, and '+why.replace(/^it /,'that '):why};
  for(const [test,why] of rules){
    const hit=pool.find(test);
    if(hit)return {node:hit,why:viaWhy(hit,why)};
  }
  return pool.length?{node:pool[0],
    why:pool.length===1?'it is the only thing waiting':'nothing else is asking louder'}:null;
}

/* ============================================================
   DO = TODAY. The one thing, then what is overdue, due today or
   urgent. Everything else waits in Plan, and a line at the bottom
   says how much, so nothing is hidden.
   ============================================================ */
const isTodayish=n=>{
  if(isDone(n))return !!(n.doneAt&&dayOff(n.doneAt)===0)||(!!n.repeat&&E(n).when!=null&&dayOff(E(n).when)<=0);
  const e=E(n);return (e.when!=null&&dayOff(e.when)<=0)||(e.when==null&&!!e.urgent);
};

/* MOVE TO: any line with parts, or the top. One tap, not a dozen arrow presses. */
function movePick(node){

  const list=document.createElement('div');list.className='scopelist';

    list.appendChild(b)};

    add(k.t||'(untitled)',d+1,k);if(d<4)w(k,d+1)})})(ROOT,0);

function moveTo(node,target){
  const f=find(node.id);if(!f||f.parent===target)return;
  const from=f.parent,idx=from.kids.indexOf(node);
  if(chain(zoom).some(a=>a.id===node.id))zoom=from.id;
  const snap=ordSnap(target);
  from.kids.splice(idx,1);target.kids.push(node);placeOrd(target,node,snap);

    const g=find(node.id);if(!g)return;
    g.parent.kids.splice(g.parent.kids.indexOf(node),1);
    const sn=ordSnap(from);from.kids.splice(Math.min(idx,from.kids.length),0,node);placeOrd(from,node,sn)});

/* ============================================================
   QUICK ADD. "call mum fri" lands on Friday; "!" at the end marks it
   urgent. Only words at the very end count, and the message offers to
   undo the guess.
   ============================================================ */
const WDS={sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,
  thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
function parseDay(raw){
  let t=raw.trim(),urgent=false,imp=false,day=null,said='';
  for(let k=0;k<4;k++){
    if(/!\s*$/.test(t)){urgent=true;t=t.replace(/\s*!+\s*$/,'');continue}
    if(/(?:^|[\s!])\*+\s*$/.test(t)){imp=true;t=t.replace(/\s*\*+\s*$/,'');continue}
    break}
  const m=t.match(/^(.*?\S)\s+(?:(?:on|by|this)\s+)?(today|tonight|tomorrow|tmrw|tmr|next week|weekend|sunday|sun|monday|mon|tuesday|tues|tue|wednesday|weds|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat)$/i);
  if(m){
    const w=m[2].toLowerCase(),now=new Date(Date.now()).getDay();
    if(w==='today'||w==='tonight')day=0;
    else if(w==='tomorrow'||w==='tmrw'||w==='tmr')day=1;
    else if(w==='next week')day=7;
    else if(w==='weekend')day=(now===6||now===0)?0:6-now;
    else{const k=WDS[w];day=(k-now+7)%7||7}
    t=m[1];said=w;
  }
  return {text:t,day,urgent,imp,said};
}
function quickAddEl(ph,defDay){
  const w=document.createElement('form');w.className='qadd';
  const inp=document.createElement('input');inp.type='text';inp.id='qadd-'+mode;inp.placeholder=ph;
  inp.autocomplete='off';inp.setAttribute('aria-label',ph.replace('…',''));inp.enterKeyHint='done';
  /* the button never submits the form natively, so nothing can ever reload the page */
  const b=document.createElement('button');b.type='button';b.className='opt';b.textContent='Add';
  w.append(inp,b);
  const go=()=>{const v=inp.value;if(!v.trim())return;
    const n=quickAdd(v,defDay);inp.value='';
    setTimeout(()=>{const again=document.getElementById(inp.id);if(again)again.focus()},30);return n};
  b.onclick=e=>{e.preventDefault();go()};
  w.onsubmit=e=>{e.preventDefault();go()};
  w.setAttribute('action','javascript:void 0');
  return w;
}
function inboxNode(){let ib=ROOT.kids.find(k=>k.inbox);
  if(!ib){ib=nd('Inbox',[],{inbox:true});const sn=ordSnap(ROOT);ROOT.kids.unshift(ib);placeOrd(ROOT,ib,sn)}
  return ib}
let addOpen=false;
function quickAdd(raw,defDay){
  const p=parseDay(raw),S=here()===ROOT?inboxNode():here();
  if(!p.text.trim()){p.text=raw.trim();p.day=null;p.urgent=false;p.imp=false}   /* "!" alone is a line, not an empty urgent one */
  const n=nd(p.text);
  if(p.day!=null)n.when=at(p.day);else if(defDay!=null)n.when=at(defDay);
  if(p.urgent)n.urgent=true;
  if(p.imp)n.imp=true;
  const snap=ordSnap(S);if(S.inbox)S.kids.unshift(n);else S.kids.push(n);placeOrd(S,n,snap);
  /* a line just added in Plan goes to the top of the box it lands in, and stays
     out of the folded notes, until you leave Plan or this place */
  if(mode==='plan'){if(freshZoom!==zoom){FRESH.clear();freshZoom=zoom}FRESH.add(n.id);freshFlash=n.id}
  save();render();
  if(addOpen){}
  else if(p.day!=null||p.urgent||p.imp){
    const mk=[p.urgent&&'urgent',p.imp&&'important'].filter(Boolean).join(' and ');
    const what=(p.day!=null?'Planned for '+(p.day===0?'today':p.day===1?'tomorrow':longDay(n.when)):'')+
      (mk?(p.day!=null?', marked '+mk:'Marked '+mk):'');
    offerUndo(what+(S.inbox?' In the Inbox.':'.'),'Keep my words',()=>{n.t=raw.trim();n.when=defDay!=null?at(defDay):null;n.urgent=false;n.imp=false;touch(n)});
  }else offerUndo('Added to '+(S.inbox?'the Inbox':'\u201C'+short(S.t||'(untitled)')+'\u201D')+'.',()=>{const i=S.kids.indexOf(n);if(i>=0)S.kids.splice(i,1)});
  return n;
}

/* ============================================================
   PLAN. Two layouts of the same lines. Dragging a card edits the one
   field the layout is about: Week sets the day, Matrix sets the marks.
   A dated or marked line with parts is planned as one card, as a whole.
   ============================================================ */
let planLens='week';
let planTrayShut=null;   /* null: decide by screen width */
let planNotesOpen=false;
const HINT=(()=>{try{return JSON.parse(localStorage.getItem('yodo.hints')||'{}')}catch(e){return {}}})(),hintSeen=new Set();
function hint(k){if(!hintSeen.has(k)){hintSeen.add(k);HINT[k]=(HINT[k]||0)+1;try{localStorage.setItem('yodo.hints',JSON.stringify(HINT))}catch(e){}}return HINT[k]<=4}
const FRESH=new Set();let freshZoom=null,freshFlash=null;
/* newest first, then the rest in their usual order */
const freshFirst=a=>[...FRESH].reverse().map(id=>a.find(n=>n.id===id)).filter(Boolean).concat(a.filter(n=>!FRESH.has(n.id)));
/* the folded group of notes at the foot of the tray (Week) or of Neither (Matrix) */
function pNotes(c,S,l){
  if(!c.notes||!c.notes.length)return;
  const k=c.notes.length,b=document.createElement('button');b.className='pnotes';
  b.setAttribute('aria-expanded',String(planNotesOpen));
  b.innerHTML='<span class="pna">'+(planNotesOpen?'\u25BE':'\u25B8')+'</span>Notes<span class="n">'+k+'</span>'+
    '<span class="pnw">'+(planNotesOpen?'Hide':'lines with no day and no mark')+'</span>';
  b.onclick=()=>{planNotesOpen=!planNotesOpen;render()};
  l.appendChild(b);
  if(planNotesOpen)c.notes.forEach(n=>l.appendChild(pCard(n,S,true)));
}
function planScan(S,kind){
  const has=kind==='week'?n=>n.when!=null:n=>!!(n.urgent||n.imp);
  /* ONE UNIT. A project with a day, a mark or a repeat is planned as one card,
     in both layouts, and its parts travel inside it (the card lists them), just as
     Do shows it by its next step. A part stands on its own only when it has its
     own day (Week) or mark (Matrix). A line that asks nothing, under nothing that
     does, is a note: notes fold away. */
  const asks=n=>n.when!=null||n.urgent||n.imp||!!n.repeat;
  const cards=[],tray=[],notes=[];
  (function w(x,covered){x.kids.forEach(k=>{
    if(!k.kids.length){if(k.done)return;if(has(k))cards.push(k);
      else if(!covered)(asks(k)||FRESH.has(k.id)?tray:notes).push(k);return}
    if(isDone(k))return;
    const unit=asks(k);

    w(k,covered||unit);

}
const byWeightP=(a,b)=>((!!(b.urgent&&b.imp))-(!!(a.urgent&&a.imp)))||(!!b.urgent-!!a.urgent)||(!!b.imp-!!a.imp);
function planColumns(S){
  const {cards,tray,notes}=planScan(S,'week');
  const cols=[];
  cols.push({key:'none',title:'No day yet',rail:true,items:tray.sort(byWeightP),notes,drop:n=>{n.when=null},said:'no day'});
  const late=cards.filter(n=>dayOff(n.when)<0);
  if(late.length)cols.push({key:'late',title:'Overdue',cls:'late',items:late.sort((a,b)=>a.when-b.when),
    drop:n=>{if(!(n.when!=null&&dayOff(n.when)<0))n.when=at(-1)},said:'overdue',action:'Move all to today'});
  const wdn=d=>new Date(at(d)).toLocaleDateString(undefined,{weekday:'short'});
  const dn=d=>new Date(at(d)).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  const day=d=>({key:'d'+d,title:d===0?'Today':d===1?'Tomorrow':wdn(d),sub:dn(d),cls:d===0?'focus':'',
    items:cards.filter(n=>dayOff(n.when)===d).sort(byWeightP),drop:n=>{n.when=at(d)},
    said:d===0?'today':d===1?'tomorrow':wdn(d),limit:d===0?5:0});
  cols.push(day(0),day(1));
  const slots=[2,3,4,5,6].map(day);
  cols.push({key:'week',title:'This week',slots,items:[].concat(...slots.map(x=>x.items)),drop:null});
  cols.push({key:'later',title:'Later',items:cards.filter(n=>dayOff(n.when)>=7).sort((a,b)=>a.when-b.when),
    drop:n=>{if(!(n.when!=null&&dayOff(n.when)>=7))n.when=at(7)},said:'later'});
  return cols;
}
function planCells(S){
  const {cards,tray,notes}=planScan(S,'matrix');
  const byDay=(a,b)=>(a.when||Infinity)-(b.when||Infinity);
  return [
    {key:'q1',title:'Urgent and important',why:'Do these first.',items:cards.filter(n=>n.urgent&&n.imp).sort(byDay),
      drop:n=>{n.urgent=true;n.imp=true},said:'urgent and important'},
    {key:'q2',title:'Important',why:'Where real progress lives. Give each one a day, or urgency will crowd it out.',
      items:cards.filter(n=>!n.urgent&&n.imp).sort(byDay),drop:n=>{n.urgent=false;n.imp=true},said:'important'},
    {key:'q3',title:'Urgent',why:'Keep these small. Ask whether they really matter.',items:cards.filter(n=>n.urgent&&!n.imp).sort(byDay),
      drop:n=>{n.urgent=true;n.imp=false},said:'urgent'},
    {key:'q4',title:'Neither',why:'Unmarked lines. Most can wait, or go.',items:tray.sort(byDay),notes,
      drop:n=>{n.urgent=false;n.imp=false},said:'neither'}

let planCols=[];

  save();

function nextOcc(node,from){
  const x=new Date(dayStart(from));

    do x.setDate(x.getDate()+1); while(x.getDay()!==node.rDay);
  }else if(node.repeat==='monthly'&&node.rDate!=null){
    let y=x.getFullYear(),m=x.getMonth();
    const fit=(y,m)=>Math.min(node.rDate,new Date(y,m+1,0).getDate());  /* the 31st in Feb is the 28th */
    if(x.getDate()>=fit(y,m)){m++;if(m>11){m=0;y++}}
    x.setFullYear(y,m,fit(y,m));

/* a ticked repeat comes back for the round after the later of: the day it was
   due, and the day it was done. Finishing early covers that round; finishing
   late does not make you owe the rounds you missed. */
/* when a line was finished: for a checklist, when its last part was */
function doneAtOf(n){
  if(!n.kids.length)return n.doneAt||0;

  const d=doneAtOf(node);

  let n=0;

    if(k.repeat&&isDone(k)){
      const d=doneAtOf(k);
      const covered=Math.max(d?dayStart(d):0,k.when!=null?dayStart(k.when):0);
      if(covered<dayStart(Date.now())){
        const nxt=nextRound(k);
        /* the line, or every part of a checklist, comes back unticked; the
           finishes stay in the tally under keys of their own */
        const reopen=x=>{if(x.kids.length){x.kids.forEach(reopen);return}
          if(!x.done)return;
          if(TALLY[x.id]!=null){TALLY[x.id+'@'+TALLY[x.id]]=TALLY[x.id];delete TALLY[x.id]}
          x.done=false;delete x.doneAt;touch(x)};

function startCoach(){coachAt=0;document.getElementById('coach').classList.add('on');paintCoach()}

function paintCoach(){
  const C=COACH[coachAt];
  const el=document.querySelector(C.sel);
  if(!el){coachAt++;return coachAt<COACH.length?paintCoach():endCoach()}
  const r=el.getBoundingClientRect(),pad=8;
  const spot=document.getElementById('spot');
  spot.style.left=(r.left-pad)+'px';spot.style.top=(r.top-pad)+'px';
  spot.style.width=(r.width+pad*2)+'px';spot.style.height=(r.height+pad*2)+'px';

  const tip=document.getElementById('tip');
  tip.innerHTML='<h4>'+C.h+'</h4><p>'+C.p+'</p><div class="row2">'+
    '<span class="n">'+(coachAt+1)+' of '+COACH.length+'</span>'+
    '<button class="later" id="c-skip">Not now</button>'+
    '<button id="c-next">'+(coachAt===COACH.length-1?'Done':'Next')+'</button></div>';
  const below=r.bottom+16, above=r.top-16;
  const useBelow = below+150 < window.innerHeight;
  tip.style.top = useBelow ? below+'px' : 'auto';
  tip.style.bottom = useBelow ? 'auto' : (window.innerHeight-above)+'px';
  const w=Math.min(270,window.innerWidth-32);
  tip.style.left=Math.max(16,Math.min(window.innerWidth-w-16,r.left+r.width/2-w/2))+'px';
  tip.style.width=w+'px';
  document.getElementById('c-next').onclick=()=>{
    coachAt++; coachAt<COACH.length?paintCoach():endCoach()};
  document.getElementById('c-skip').onclick=endCoach;
}

/* ---------- swipe sideways to change mode ---------- */
(function(){
  let x0=0,y0=0,live=false;
  const main=document.querySelector('main');
  main.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const t=e.target;
    /* never steal the gesture from text, the tray, a sheet or a scroller */
    if(t.closest('[contenteditable="true"]')||t.closest('.ctl')||t.closest('.sheet')
       ||t.closest('.pad')||t.closest('.lens')||t.closest('#modes')||t.closest('.pcard')
       ||t.closest('input'))return;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;live=true;
  },{passive:true});
  main.addEventListener('touchend',e=>{
    if(!live)return;live=false;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
    const order=['map','plan','do'],i=order.indexOf(mode);
    const want=order[Math.max(0,Math.min(2,i+(dx<0?1:-1)))];
    if(want!==mode){mode=want;openId=null;save();render();buzz(8)}
  },{passive:true});
})();

function goTo(id,push){
  zoom=id;openId=null;
  if(push!==false)history.pushState({zoom:id,mode},'');
  render();
}
window.addEventListener('popstate',e=>{
  if(document.getElementById('focus').classList.contains('on')){endFocus();return}
  if(sheet.classList.contains('on')){sheet.classList.remove('on');return}
  const st=e.state;
  if(st&&st.zoom&&find(st.zoom)){mode=st.mode||'map';zoom=st.zoom;openId=null;render();return}
  const c=chain(zoom);
  if(c.length>1){zoom=c[c.length-2].id;openId=null;render()}
});
/* every way of going deeper now records a step */
document.addEventListener('DOMContentLoaded',()=>{});
const _oldRender=render;
history.replaceState({zoom,mode},'');

const saved=load();
if(saved&&saved.zoom&&find(saved.zoom)){zoom=saved.zoom;mode=saved.mode||'map'}
render();

/* long-press the home-screen icon: jump straight in */
const q=new URLSearchParams(location.search).get('go');
if(q==='do'||q==='plan'){mode=q;render()}
if(q==='new'){setTimeout(()=>{const g=document.querySelector('.ghost');if(g)g.click()},300)}

let seen=false;
try{seen=localStorage.getItem('yodo.seen')==='1'}catch(e){}
if(!seen&&!ROOT.kids.length)setTimeout(startIntro,250);
(function(){let n=0;(function w(x){x.kids.forEach(k=>{
  if(k.done&&k.doneAt&&!k.kids.length&&TALLY[k.id]==null){TALLY[k.id]=k.doneAt;n++}
  w(k)})})(ROOT);if(n)tallySave()})();
/* pins left on lines that were unmarked before alpha 22 */
(function w(x){x.kids.forEach(k=>{unpinIfBare(k);w(k)})})(ROOT);
/* alpha 20 pushed a repeat a round further on every tap, and counted every
   tap. Undo both: a repeat it moved comes back to its first round after the
   day it was last done, and duplicate counts for the same line and day go. */
(function(){
  let fixed=0;
  (function w(x){x.kids.forEach(k=>{
    if(k.repeat&&k.lastDone&&!k.kids.length){
      const right=nextOcc(k,dayStart(k.lastDone));
      if(k.when==null||k.when>right){k.when=right;fixed++}
      delete k.lastDone;touch(k);
    }
    w(k)})})(ROOT);
  const seen={};
  Object.keys(TALLY).filter(key=>key.includes('@')).sort().forEach(key=>{
    const day=dayStart(TALLY[key]),sig=key.split('@')[0]+'|'+day;
    if(seen[sig])delete TALLY[key];else seen[sig]=1;
  });
  tallySave();
})();
/* repeats set before alpha 20 may have no day, which hid them from Do */
(function w(x){x.kids.forEach(k=>{if(k.repeat&&!k.kids.length&&k.when==null){k.when=firstOcc(k);touch(k)}w(k)})})(ROOT);
posReady=!syncOn();
normalizeOrds();
stamp(true);
/* ask the browser not to clear this site's storage when space runs low */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
if(syncOn())setTimeout(syncNow,600);

/* offline */
if('serviceWorker' in navigator)
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
