<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yodo</title>
<meta name="description" content="An outline you can tick off. Everything is a line; a line becomes a project the moment it gets parts.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F7F2E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yodo">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..600,0..100,0..1&family=Instrument+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE DESIGN SYSTEM.  Every colour, size, radius and space lives
   here and nowhere else. No value gets typed inline again.
   ============================================================ */
:root{
  /* paper */
  --bg:#F7F2E7; --paper:#FEFCF6;
  --ink:#2A241C; --dim:#585146; --faint:#756B5D;
  --hair:#2a241c12; --guide:#2a241c0d;
  --acc:#C2611F; --acc-t:#AB551B; --late:#B0402F;

  /* space — a 4px scale, nothing off it */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:32px;

  /* radius */
  --r1:8px; --r2:14px; --r3:20px; --rp:999px;

  /* form */
  --hit:22px;            /* every circular control */
  --row:46px;            /* every row */
  --indent:18px;
  --caret-w:28px;  --caret-pull:8px;  --row-gap:18px;
  /* exactly where the tick's left edge lands. the cue and the tray both hang
     off this same line, so they can never drift apart again. */
  --body:calc(var(--caret-w) - var(--caret-pull) + var(--row-gap));
  /* where the title text begins — the cue hangs off this, since it is the
     title's own second line */
  --textx:calc(var(--body) + var(--hit) + var(--row-gap));

  /* breathing, by how far you are from where you're standing.
     elders get air. descendants get closeness. */
  --air-1:30px;          /* above an elder that holds things */
  --air-1s:10px;         /* above an elder that holds nothing */
  --air-2:14px;
  --air-3:2px;

  /* motion */
  --spring:cubic-bezier(.34,1.7,.5,1);
  --ease:cubic-bezier(.2,.9,.3,1);

  /* type */
  --fs:1; --ff:'Instrument Sans'; --fd:'Fraunces';
  --t-row:17px; --t-d1:18px; --t-d2:16.5px; --t-deep:15.5px;
  --t-mark:12.5px; --t-ctl:13px; --t-sub:13.5px;
}
[data-theme="light"]{--bg:#F7F7F8;--paper:#FFF;--ink:#1C1B1F;--dim:#56545A;--faint:#706E76;
  --hair:#1c1b1f12;--guide:#1c1b1f0d;--acc-t:#AF571C}
[data-theme="dark"]{--bg:#15140F;--paper:#201F19;--ink:#EDE9DE;--dim:#A79F90;--faint:#868074;
  --hair:#ffffff14;--guide:#ffffff0d;--acc:#D98040;--acc-t:#D98040;--late:#E28270}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 44x44 is the floor for anything you tap. these overlays grow the reachable
   area without touching a single pixel of the drawing. */
.tick,.into,.caret,.ico,.back,.star{position:relative}
.tick::after,.into::after,.caret::after,
.ico::after,.back::after,.star::after{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100%,42px);height:max(100%,44px);border-radius:var(--rp)}
/* the caret sits right beside the tick, so it keeps its own width and only
   grows downward — otherwise the two overlays fight over the same pixels */
.caret::after{width:100%;height:44px}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ff),system-ui,sans-serif;
  font-size:calc(16px*var(--fs));-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;transition:background .35s,color .35s}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
::selection{background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--ink)}
[contenteditable="true"]{caret-color:var(--acc)}
/* iOS zooms the whole page when a focused field is under 16px */
.note:focus{font-size:16px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:var(--r1)}
main{width:100%;max-width:640px;padding:0 var(--s5) 180px;height:100dvh;overflow-y:auto}

/* ---------- head ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);
  margin:0 calc(-1 * var(--s5)) var(--s4);
  padding:calc(env(safe-area-inset-top) + var(--s3)) var(--s5) var(--s2);
  border-bottom:1px solid var(--hair)}
.bar1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s2)}
.bar1 .icons{display:flex;gap:var(--s2);justify-self:end}
.bar2{display:flex;align-items:center;gap:12px;margin-top:2px;min-height:30px}
.brand{font-family:var(--fd),Georgia,serif;font-variation-settings:'SOFT' 55,'WONK' 1;
  font-weight:400;font-size:calc(16px*var(--fs));letter-spacing:.055em;
  color:var(--faint);text-transform:lowercase;
  transition:color .25s}
.brand:hover{color:var(--dim)}
.back{width:30px;height:30px;border-radius:var(--rp);color:var(--dim);display:grid;
  place-items:center;font-size:16px;flex:none;transition:color .2s,background .2s,transform .16s var(--spring)}
.back:hover{color:var(--ink);background:var(--hair)}
.back:active{transform:scale(.88)}
.back.off{opacity:.25;pointer-events:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap;
  font-size:calc(13px*var(--fs));color:var(--faint)}
.crumbs button{color:var(--dim);padding:11px 2px;min-height:44px}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
.crumbs .sep{opacity:.4}
.ico{width:32px;height:32px;border-radius:var(--rp);color:var(--faint);display:grid;
  place-items:center;font-size:14px;flex:none;transition:color .2s,background .2s}
.ico:hover{color:var(--ink);background:var(--hair)}
h1{font-family:var(--fd),Georgia,serif;font-variation-settings:'SOFT' 55,'WONK' 1;
  text-wrap:balance;font-weight:600;font-size:calc(26px*var(--fs));letter-spacing:-.024em;line-height:1.14;
  margin:0 0 var(--s4);outline:none;color:var(--ink)}

/* ---------- tree ---------- */
.kids .kids{margin-left:8px;padding-left:var(--indent);position:relative;
  padding-top:var(--s1);padding-bottom:var(--s2)}
.kids .kids::before{content:'';position:absolute;left:0;top:0;bottom:6px;width:1px;background:var(--guide)}

.row{display:flex;align-items:flex-start;gap:var(--row-gap);min-height:var(--row);
  padding:var(--s2) 0;transition:opacity .35s}

/* ---- sectioning. an elder that holds things reads as a heading. ---- */
.d1{margin-top:var(--air-1s)}
/* every branch gets a line above it and room to breathe.
   so does the first loose line after a branch ends. */
.d1.holds,
.d1.holds + .d1:not(.holds){
  border-top:1px solid var(--hair);
  margin-top:var(--air-1);
  padding-top:var(--s3);
}
.d1.holds>.row{padding-bottom:var(--s1)}
.d1:first-child{margin-top:0;border-top:none;padding-top:0}
.d2{margin-top:0}
.d2.holds{margin-top:var(--air-2)}
.d3,.d4{margin-top:var(--air-3)}
.d3>.row,.d4>.row{padding:5px 0;min-height:36px}
.d2>.row{padding:7px 0;min-height:42px}

/* the guide fades as it goes deeper — closeness, not a cage */
.kids .kids::before{background:linear-gradient(var(--guide),transparent 92%)}
.d2 .kids::before{opacity:.6}
.d3 .kids::before{opacity:.35}

.caret{width:var(--caret-w);height:34px;flex:none;display:grid;place-items:center;color:var(--dim);
  font-size:18px;transition:transform .2s var(--ease),color .2s,background .2s;
  opacity:1;margin-left:calc(-1 * var(--caret-pull));border-radius:var(--rp)}
.caret:hover{background:var(--hair);color:var(--ink)}
.caret:hover{color:var(--ink)}
.caret.open{transform:rotate(90deg)}
.caret.none{visibility:hidden}

/* CIRCLE. one size, from the system. */
.tick{width:var(--hit);height:var(--hit);flex:none;margin-top:2px;border-radius:var(--rp);
  border:1.5px solid var(--faint);display:grid;place-items:center;
  transition:transform .18s var(--spring),background .2s,border-color .2s}
.tick svg{width:11px;height:11px;stroke:var(--paper);stroke-width:2.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;
  transition:stroke-dashoffset .22s ease .04s}
.tick:hover{border-color:var(--dim)}
.tick:active{transform:scale(.82)}

/* EVERY row has a way in. leaf = a dot. parent = a ring and a count.
   this is how a to-do becomes a project. */
.into{display:flex;align-items:center;gap:var(--s1);flex:none;color:var(--faint);
  margin-top:1px;padding:2px 0 2px 3px;transition:color .2s,transform .18s var(--spring)}
.into:hover{color:var(--acc)}
.into:active{transform:scale(.88)}
.into .n{font-size:calc(var(--t-mark)*var(--fs));font-variant-numeric:tabular-nums}
.into svg{width:18px;height:18px;display:block}
.into .prog{transform:rotate(-90deg)}
.into circle{fill:none;stroke-width:2.4}
.into .bg{stroke:currentColor;opacity:.3}
.into .fg{stroke:var(--acc);transition:stroke-dashoffset .5s var(--ease)}
.into .dot{fill:currentColor;opacity:.55;stroke:none}
.into:hover .dot{opacity:1}

/* depth changes SIZE only. never colour — an urgent thing three levels
   down must not look like the least important thing on screen. */
/* title and marks share one wrapping line. the title has a floor, so it can
   never be squeezed into a vertical column of letters. */
.main{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;
  column-gap:12px;row-gap:2px}
.t{flex:1 1 auto;min-width:15ch;outline:none;overflow-wrap:anywhere;min-height:1.4em;
  text-wrap:pretty;
  font-size:calc(var(--t-row)*var(--fs));line-height:1.36;letter-spacing:-.005em}
.t[contenteditable="true"]:empty::before{content:'\200b'}
.d1>.row .t{font-size:calc(var(--t-d1)*var(--fs));font-weight:500}
.d1.holds>.row .t{font-size:calc(20px*var(--fs));font-weight:600;letter-spacing:-.018em}
.d2>.row .t{font-size:calc(var(--t-d2)*var(--fs))}
.d2.holds>.row .t{font-weight:500}
.d3>.row .t,.d4>.row .t{font-size:calc(var(--t-deep)*var(--fs));letter-spacing:0}

/* a date changes the LINE */
.row.today .t{font-weight:500}
.row.late .t{color:var(--late)}

.note{padding:0 44px 0 var(--textx);margin-top:0;font-size:calc(12.5px*var(--fs));color:var(--faint);
  line-height:1.4;outline:none;max-width:52ch;overflow-wrap:anywhere}
/* a line that carries a cue gives up its own bottom padding, so the cue sits
   close to its parent — but never close to the marks that wrapped above it. */
.hasnote>.row{padding-bottom:1px}
.hasnote>.row .marks{margin-bottom:5px}
.note:focus{color:var(--dim)}
.note::before{opacity:.7}
.note:empty{display:none}
.note[data-ph]:empty{display:block}
.note[data-ph]:empty{font-size:calc(15px*var(--fs));color:var(--dim)}
.note[data-ph]:empty::before{content:'where will you be when you do this?';color:var(--dim)}
.note::before{content:'\21B3\00a0\00a0';color:var(--faint)}

.note.edit{color:var(--ink)}
.d3 .note,.d4 .note{font-size:calc(11.8px*var(--fs))}
.done>.note{opacity:.34}

.marks{display:flex;align-items:center;gap:16px;flex:0 0 auto;margin-top:0}
.marks:empty{display:none}
.mk{font-size:calc(var(--t-mark)*var(--fs));color:var(--faint);white-space:nowrap}
.mk.today{color:var(--acc-t);font-weight:500}
.mk.late{color:var(--late);font-weight:500}
.mk.rep::before{content:'↻ '}
.flags{display:inline-flex;align-items:center;gap:5px}
.mk.urg{color:var(--late);font-weight:500}
.mk.imp{color:var(--acc-t);font-weight:500}

.done>.row{opacity:.34}
.done>.row .t{text-decoration:line-through;text-decoration-thickness:1px}
.done>.row .tick{background:var(--acc);border-color:var(--acc)}
.done>.row .tick svg{stroke-dashoffset:0}

/* ---------- controls under the row ---------- */
.ctl{padding:2px 0 var(--s3) var(--body);animation:fade .2s var(--ease);position:relative}
.shut{position:absolute;right:5px;top:-34px;width:34px;height:34px;border-radius:var(--rp);
  color:var(--faint);display:grid;place-items:center;font-size:13px;background:var(--hair);
  transition:color .2s,background .2s}
.shut::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:var(--rp)}
.shut:hover{color:var(--ink);background:#2a241c1a}
.ctl .line{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ctl .line+.line{margin-top:6px}
.foot .key{color:var(--dim);font-weight:500}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.cb{padding:12px 10px;border-radius:var(--rp);min-height:44px;display:inline-flex;
  align-items:center;font-size:calc(var(--t-ctl)*var(--fs));
  color:var(--dim);background:var(--hair);white-space:nowrap;
  transition:background .16s,color .16s,transform .14s var(--spring)}
.cb:active{transform:scale(.93)}
.cb:hover{color:var(--ink)}
.cb.set{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc-t)}
.cb.set.urg{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}
.cb.set.late{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}
.cb.sym{padding:12px 13px;font-size:14px;line-height:1}
.pad{display:flex;background:var(--hair);border-radius:var(--rp);flex:none;
  align-items:stretch}
.pad button:first-child{border-radius:var(--rp) 0 0 var(--rp)}
.pad button:last-child{border-radius:0 var(--rp) var(--rp) 0}
.pad button{padding:13px 12px;line-height:0;color:var(--dim);min-height:44px;min-width:42px;
  display:flex;align-items:center;justify-content:center;
  transition:background .16s,color .16s}
.mv{width:20px;height:15px;display:block;fill:currentColor;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mv path{fill:none}
.pad button[aria-label="Up"] .mv,.pad button[aria-label="Down"] .mv{width:14px;height:19px}
.pad button:hover{background:#2a241c14;color:var(--ink)}
.pad button:active{background:#2a241c22}
.pad .sp{width:1px;background:#2a241c14;flex:none}
.pad .bin{font-size:13px;color:var(--faint)}
.pad .bin:hover{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}

.cb.del{color:var(--late);background:transparent;padding:12px 12px;margin-left:auto}
.cbv{margin-left:5px;font-size:.92em}
.sw{width:13px;height:13px;border-radius:var(--rp);display:inline-block;vertical-align:-2px}
.sw.none{border:1.5px solid var(--faint);background:transparent}
.opt.hue{display:flex;align-items:center;gap:8px;text-transform:capitalize}
.cb.del:hover{background:color-mix(in srgb,var(--late) 12%,transparent)}
.cb.x{background:transparent;color:var(--faint);padding:12px 12px;font-size:13px}

.opening{color:var(--dim);font-size:calc(15px*var(--fs));line-height:1.65;
  max-width:34ch;margin:0 0 var(--s5)}
.ghost{display:flex;align-items:center;gap:var(--row-gap);padding:var(--s4) 0;min-height:48px;cursor:text;
  opacity:.45;transition:opacity .2s}
.ghost:hover{opacity:.9}
.ghost .g{width:var(--hit);margin-left:var(--body);display:grid;place-items:center;flex:none}
.ghost .g i{width:5px;height:5px;border-radius:var(--rp);background:var(--faint);display:block}
.ghost span{font-size:calc(16px*var(--fs));color:var(--faint)}

/* ---------- mode toggle ---------- */
.modes{display:flex;background:var(--hair);border-radius:var(--rp);padding:2px;flex:none}
.modes button{padding:11px 16px;border-radius:var(--rp);min-height:44px;
  font-size:calc(12.5px*var(--fs));
  color:var(--dim);letter-spacing:.02em;transition:background .22s,color .22s}
.modes button.on{background:var(--paper);color:var(--ink);
  box-shadow:0 1px 3px #2a241c1a;font-weight:500}

/* ---------- DO: chronological, check-off only ---------- */
.theone{background:var(--paper);border-radius:var(--r3);padding:var(--s5) var(--s5) var(--s4);
  margin:var(--s4) 0 var(--s2);box-shadow:0 10px 30px -14px rgba(42,36,28,.35),0 1px 2px rgba(42,36,28,.06);
  border-top:3px solid var(--acc)}
.theone .lead{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc-t);
  margin-bottom:var(--s3)}
.theone .oanc{font-size:calc(11px*var(--fs));color:var(--faint);letter-spacing:.05em;margin-bottom:5px}
.theone .otitle{font-family:var(--fd),Georgia,serif;font-variation-settings:'SOFT' 55,'WONK' 1;
  font-weight:600;font-size:calc(24px*var(--fs));letter-spacing:-.024em;line-height:1.22;
  text-wrap:balance}
.theone .ocue{margin-top:var(--s2);font-size:calc(14px*var(--fs));color:var(--dim)}
.theone .owhy{margin-top:var(--s3);font-size:calc(13px*var(--fs));color:var(--faint);font-style:italic}
.theone .oact{display:flex;gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap;align-items:center}
.cb.pin{font-size:calc(12.5px*var(--fs));color:var(--faint);background:transparent;padding:7px 10px}
.cb.pin:hover{color:var(--acc-t);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.cb.pin.on{color:var(--acc-t);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.theone .pinned{font-size:calc(11px*var(--fs));color:var(--acc-t);letter-spacing:.1em;
  text-transform:uppercase;margin-top:var(--s2)}
.go.big{padding:11px 22px;font-size:calc(14.5px*var(--fs))}

.lens{display:flex;gap:2px;background:var(--hair);border-radius:var(--rp);padding:2px;
  width:fit-content;margin:var(--s2) 0 0}
.lens button{padding:11px 16px;border-radius:var(--rp);min-height:44px;
  font-size:calc(12.5px*var(--fs));
  color:var(--dim);transition:background .22s,color .22s}
.lens button.on{background:var(--paper);color:var(--ink);font-weight:500;box-shadow:0 1px 3px #2a241c1a}
.band{margin:var(--s6) 0 var(--s3)}
.band:first-child{margin-top:var(--s2)}
.bandbtn{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;text-align:left}
.band h2{font-family:var(--fd),Georgia,serif;font-weight:600;font-size:calc(15px*var(--fs));
  letter-spacing:.02em;color:var(--dim);text-transform:lowercase;margin:0}
.band .fold{color:var(--faint);font-size:11px;transition:transform .2s var(--ease);display:inline-block}
.band.folded .fold{transform:rotate(-90deg)}
.band .n{margin-left:auto;font-size:calc(12px*var(--fs));color:var(--faint);
  font-variant-numeric:tabular-nums}
.band.now h2{color:var(--acc-t)}
.band.late h2{color:var(--late)}

.doit{padding:var(--s3) 0 var(--s4);border-bottom:1px solid var(--hair);transition:opacity .35s}
.doit:last-child{border-bottom:none}
/* the roots, tiny and quiet — they say where it came from, nothing more */
.roots{display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  font-size:calc(11px*var(--fs));color:var(--faint);letter-spacing:.05em;
  margin-bottom:var(--s1);padding-left:33px}
.roots .r{opacity:.75}
.roots .r:last-child{opacity:1;color:var(--dim)}
.roots .s{opacity:.4}
.doline{display:flex;align-items:flex-start;gap:var(--s3)}
.dotext{flex:1;min-width:0;font-size:calc(18px*var(--fs));line-height:1.35;font-weight:400;
  letter-spacing:-.006em}
/* one line at a time can be brought forward. it is a spotlight, not a badge. */
.doit.lit{background:color-mix(in srgb,var(--acc) 7%,transparent);
  border-radius:var(--r2);padding-left:14px;padding-right:12px;margin:0 -14px;
  box-shadow:inset 3px 0 0 var(--acc)}
.doit.lit .dotext{font-weight:600;font-size:calc(21px*var(--fs));letter-spacing:-.018em}
.doit.lit .roots{padding-left:33px}
.lamp{padding:12px 12px;border-radius:var(--rp);background:var(--surf3,transparent);
  color:var(--faint);font-size:15px;line-height:1;min-height:44px;
  display:inline-flex;align-items:center;transition:color .2s,background .2s}
.lamp:hover{color:var(--acc-t);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.lamp.on{color:var(--acc-t);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.doit.done .dotext{text-decoration:line-through;text-decoration-thickness:1px}
.doit.done{opacity:.34}
.dometa{display:flex;align-items:center;gap:var(--s3);margin:var(--s2) 0 0 33px;flex-wrap:wrap}

    <span class="key">📅</span> a day · <span class="key">↻</span> repeats ·

<script>
const TICK='<svg viewBox="0 0 14 14"><polyline points="2,7.4 5.4,10.6 12,3.6"/></svg>';
/* the dot IS the bullet. these say: move this bullet. */
const ICO={
  in:  '<svg class="mv" viewBox="0 0 22 14"><circle cx="3.2" cy="7" r="2.6"/>'+
       '<path d="M7.6 7h9M13.4 3.8L17 7l-3.6 3.2"/></svg>',
  out: '<svg class="mv" viewBox="0 0 22 14"><circle cx="18.8" cy="7" r="2.6"/>'+
       '<path d="M14.4 7h-9M8.6 3.8L5 7l3.6 3.2"/></svg>',
  up:  '<svg class="mv" viewBox="0 0 14 22"><circle cx="7" cy="18.8" r="2.6"/>'+
       '<path d="M7 14.4v-9M3.8 8.6L7 5l3.2 3.6"/></svg>',
  down:'<svg class="mv" viewBox="0 0 14 22"><circle cx="7" cy="3.2" r="2.6"/>'+
       '<path d="M7 7.6v9M3.8 13.4L7 17l3.2-3.6"/></svg>'
};
const DAY=864e5;
/* one short pulse when a thing is finished. silent if the device cannot. */
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms||12)}catch(e){}}
let uid=0;const nid=()=>'n'+(++uid);
const at=d=>{const x=new Date();x.setDate(x.getDate()+d);x.setHours(18,0,0,0);return x.getTime()};
const nd=(t,kids,x)=>Object.assign({id:nid(),t,kids:kids||[],done:false,collapsed:true},x||{});

const ROOT=nd('Everything',[]);

/* ---------- it has to survive a reload ---------- */
var askCue=false;
const KEY='yodo.v1';
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(
    {tree:ROOT,zoom,mode,uid,doLens,askCue,shut,theme:document.body.dataset.theme,
     fs:document.documentElement.style.getPropertyValue('--fs'),
     ff:document.documentElement.style.getPropertyValue('--ff'),
     flen:F_LEN}))}catch(e){}
}
let saveT;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,250)}
function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw)return false;
    const d=JSON.parse(raw); if(!d||!d.tree)return false;
    Object.assign(ROOT,d.tree);
    uid=d.uid||uid;
    if(d.theme)document.body.dataset.theme=d.theme;
    if(d.fs)document.documentElement.style.setProperty('--fs',d.fs);
    if(d.ff)document.documentElement.style.setProperty('--ff',d.ff);
    if(d.flen)F_LEN=d.flen;
    if(d.doLens)doLens=d.doLens;
    if(typeof d.askCue==='boolean')askCue=d.askCue;
    if(d.shut)shut=d.shut;
    return d;
  }catch(e){return false}
}

let zoom=ROOT.id, openId=null, mode='map';

function find(id,node,parent){node=node||ROOT;
  if(node.id===id)return{node,parent:parent||null};
  for(const k of node.kids){const r=find(id,k,node);if(r)return r}return null}
function chain(id){const out=[];let c=find(id);
  while(c){out.unshift(c.node);c=c.parent?find(c.parent.id):null}return out}
/* if the node you were standing in has gone, step out to the nearest one that
   still exists rather than throwing. */
const here=()=>{
  let f=find(zoom);
  if(f)return f.node;
  zoom=ROOT.id;openId=null;
  return ROOT;
};
function stats(x){let d=0,t=0;for(const k of x.kids){t++;const s=stats(k);
  if(k.done||(k.kids.length&&s.total&&s.done===s.total))d++}return{done:d,total:t}}
const isDone=x=>{const s=stats(x);return x.done||(x.kids.length&&s.total&&s.done===s.total)};

function label(ms){
  if(ms==null)return null;
  const diff=ms-Date.now(),d=Math.floor(diff/DAY);
  if(diff<0) return{txt:Math.ceil(-diff/DAY)+'d late',cls:'late'};
  if(d===0)  return{txt:'today',cls:'today'};
  if(d===1)  return{txt:'tomorrow',cls:''};
  if(d<7)    return{txt:new Date(ms).toLocaleDateString(undefined,{weekday:'short'}),cls:''};
  return{txt:new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short'}),cls:''};
}

/* ============================================================
   MERGEABLE — the part that has to exist before any sync does.
   A tree does not merge on its own: last-write-wins on a whole
   document silently destroys whatever the other device did.
   So: every node carries its own clock, deletions leave a mark,
   and nothing is ever dropped for being an orphan.
   ============================================================ */
var DEVICE=(function(){
  try{
    let d=localStorage.getItem('yodo.device');
    if(!d){d='d'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
      localStorage.setItem('yodo.device',d)}
    return d;
  }catch(e){return 'd-local'}
})();

/* deletions leave a mark, or they come back on the next merge */
var GONE=(function(){try{return JSON.parse(localStorage.getItem('yodo.gone')||'{}')}catch(e){return {}}})();
function markGone(id){
  GONE[id]=Date.now();
  /* keep it small: a tombstone older than 90 days has done its job */
  const cut=Date.now()-90*DAY;
  for(const k in GONE)if(GONE[k]<cut)delete GONE[k];
  try{localStorage.setItem('yodo.gone',JSON.stringify(GONE))}catch(e){}
}
function killNode(node,parent){
  const i=parent.kids.indexOf(node);
  if(i<0)return -1;
  (function mark(n){markGone(n.id);n.kids.forEach(mark)})(node);
  parent.kids.splice(i,1);
  return i;
}

/* flat form: every node knows its own parent and place */
function flatten(root){
  const out=[];
  (function walk(n,parent,i){
    n.kids.forEach((k,idx)=>{
      out.push(Object.assign({},k,{kids:undefined,_p:n.id,_o:(k.ord!=null?k.ord:idx*100)}));
      walk(k,n,idx);
    });
  })(root,null,0);
  return out;
}
function rebuild(rows,rootId,rootTitle){
  const byId={},root={id:rootId,t:rootTitle||'Everything',kids:[],done:false,collapsed:false};
  byId[rootId]=root;
  rows.forEach(r=>{byId[r.id]=Object.assign({},r,{kids:[]});delete byId[r.id].kids0});
  rows.forEach(r=>{
    const me=byId[r.id];
    let p=byId[r._p];
    if(!p)p=root;                       /* an orphan joins the root, never vanishes */
    p.kids.push(me);
  });
  (function sort(n){n.kids.sort((a,b)=>(a._o||0)-(b._o||0));
    n.kids.forEach(k=>{delete k._p;delete k._o;sort(k)})})(root);
  return root;
}

/* the merge itself: newest edit wins per node, a deletion beats an older edit */
function mergeTrees(mine,theirs){
  const A=flatten(mine.tree||mine), B=flatten(theirs.tree||theirs);
  const gone=Object.assign({},mine.gone||{},{});
  const tg=theirs.gone||{};
  for(const k in tg)gone[k]=Math.max(gone[k]||0,tg[k]);

  const keep={},stat={fromMine:0,fromTheirs:0,deleted:0,reattached:0};
  const consider=(row,side)=>{
    const cur=keep[row.id];
    if(!cur||(row.touched||0)>(cur.touched||0)){keep[row.id]=row;
      if(side==='mine')stat.fromMine++;else stat.fromTheirs++}
  };
  A.forEach(r=>consider(r,'mine'));
  B.forEach(r=>consider(r,'theirs'));

  const rows=[];
  for(const id in keep){
    const r=keep[id];
    if(gone[id]&&gone[id]>=(r.touched||0)){stat.deleted++;continue}
    rows.push(r);
  }
  const alive={};rows.forEach(r=>alive[r.id]=1);
  const rootId=(mine.tree||mine).id;
  rows.forEach(r=>{if(r._p!==rootId&&!alive[r._p]){r._p=rootId;stat.reattached++}});

  return {tree:rebuild(rows,rootId,(mine.tree||mine).t),gone:gone,stat:stat};
}

/* ---------- getting your list out of here ---------- */
function dl(name,text,type){
  const b=new Blob([text],{type:type||'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function asText(){
  const out=[];
  (function walk(x,d){
    x.kids.forEach(k=>{
      const bits=[];
      if(k.when!=null){const l=label(k.when);if(l)bits.push(l.txt)}
      if(k.repeat)bits.push('repeats '+k.repeat);
      if(k.urgent)bits.push('urgent');
      if(k.imp)bits.push('important');
      out.push('  '.repeat(d)+(k.done?'[x] ':'[ ] ')+k.t+
        (bits.length?'   ('+bits.join(', ')+')':''));
      if(k.note)out.push('  '.repeat(d)+'    \u21B3 '+k.note);
      walk(k,d+1);
    });
  })(ROOT,0);
  return (ROOT.t||'Everything')+'\n\n'+out.join('\n')+'\n';
}
function toastLine(msg){offerUndo(msg,null)}

/* ---------- undo: nothing destructive is one-way ---------- */
let undoFn=null,undoT;
function offerUndo(msg,fn){
  undoFn=fn||null;
  document.getElementById('undo-t').textContent=msg;
  document.getElementById('undo-b').style.display=fn?'':'none';
  const u=document.getElementById('undo');u.classList.add('on');
  clearTimeout(undoT);undoT=setTimeout(()=>{u.classList.remove('on');undoFn=null},5000);
}
document.getElementById('undo-b').onclick=()=>{
  if(undoFn)undoFn();undoFn=null;
  document.getElementById('undo').classList.remove('on');render();
};

/* ---------- render ---------- */
function render(){
  document.getElementById('tree').style.display   = mode==='map'?'':'none';
  document.getElementById('dolist').style.display = mode==='do' ?'':'none';
  document.getElementById('fold').style.visibility = mode==='map'?'':'hidden';
  document.querySelectorAll('#modes button').forEach(b=>
    b.classList.toggle('on',b.dataset.m===mode));
  document.getElementById('bar2').style.display = mode==='do'?'none':'';
  if(mode==='do')return renderDo();
  const H=here();
  const cr=document.getElementById('crumbs');cr.innerHTML='';
  chain(zoom).slice(0,-1).forEach(node=>{
    const b=document.createElement('button');b.textContent=node.t;
    b.onclick=()=>{goTo(node.id)};
    cr.append(b,Object.assign(document.createElement('span'),{className:'sep',textContent:'›'}));
  });
  const h=document.getElementById('title');
  if(document.activeElement!==h)h.textContent=H.t;
  h.oninput=()=>{H.t=h.textContent;saveSoon()};

  const t=document.getElementById('tree');t.innerHTML='';
  if(!H.kids.length&&H.id===ROOT.id){
    const hint=document.createElement('div');
    hint.className='opening';
    hint.textContent='Anything at all. It does not have to be a task, or well formed, '+
      'or in the right place \u2014 structure comes later, and mostly on its own.';
    t.appendChild(hint);
  }
  t.appendChild(kidsEl(H,1));
  ghost(t,H);
  save();
}

function kidsEl(parent,depth){
  const box=document.createElement('div');box.className='kids';
  parent.kids.forEach(k=>box.appendChild(rowEl(k,parent,depth)));
  return box;
}

function rowEl(node,parent,depth){
  const wrap=document.createElement('div');
  const s=stats(node),has=node.kids.length>0;
  wrap.className='d'+Math.min(depth,4)+(has?' holds':'')+(isDone(node)?' done':'')+
    ((node.note||openId===node.id)?' hasnote':'');

  const lab=label(node.when);
  const r=document.createElement('div');
  r.className='row'+(lab?' '+lab.cls:'');

  const car=document.createElement('button');
  car.className='caret'+(has?'':' none')+(has&&!node.collapsed?' open':'');
  car.innerHTML='&#9656;';car.tabIndex=-1;
  car.onclick=e=>{e.stopPropagation();
    node.collapsed=!node.collapsed;openId=null;render()};

  const tick=document.createElement('button');
  tick.className='tick';tick.innerHTML=TICK;tick.setAttribute('aria-label','finish');
  tick.onclick=e=>{e.stopPropagation();
    node.done=!node.done;
    if(node.done){buzz(14);if(openId===node.id)openId=null}
    render()};

  const tx=document.createElement('div');
  tx.className='t';tx.spellcheck=false;tx.textContent=node.t;
  /* lateness is information; a chosen colour is not. information wins. */
  if(node.hue&&!(lab&&lab.cls==='late'))tx.style.color=HUES[node.hue];
  tx.dataset.id=node.id;
  /* first tap opens the row. second tap edits it. the keyboard only
     appears when you actually mean to type. */
  tx.contentEditable = (openId===node.id)?'true':'false';
  tx.onclick=e=>{
    if(openId!==node.id){
      e.preventDefault();openId=node.id;render();
      /* nothing written yet? then you meant to write. skip the second tap. */
      if(!node.t)focus(node.id);
    }
  };
  tx.oninput=()=>{node.t=tx.textContent;saveSoon()};
  tx.onkeydown=e=>key(e,node,parent);

  const m=document.createElement('div');m.className='marks';
  const marks=[];
  /* both flags together count as ONE mark, so a date can never be pushed off */
  if(node.urgent||node.imp){
    marks.push('<span class="flags">'+
      (node.urgent?'<span class="mk urg">\u23F1</span>':'')+
      (node.imp?'<span class="mk imp">Imp</span>':'')+'</span>');
  }
  if(lab)marks.push(`<span class="mk ${lab.cls}">${lab.txt}</span>`);
  else if(node.repeat)marks.push(`<span class="mk rep">${
    node.repeat==='weekly'&&node.rDay!=null?WD[node.rDay]
    :node.repeat==='monthly'&&node.rDate!=null?('the '+node.rDate)
    :node.repeat}</span>`);
  m.innerHTML=marks.slice(0,2).join('');

  /* EVERY row gets a way in */
  const into=document.createElement('button');
  into.className='into';into.setAttribute('aria-label','step inside');
  if(has){
    const R=7,C=2*Math.PI*R,p=s.total?s.done/s.total:0;
    into.innerHTML=`${node.collapsed?`<span class="n">${s.total-s.done}</span>`:''}
      <svg class="prog" viewBox="0 0 18 18"><circle class="bg" cx="9" cy="9" r="${R}"/>
      <circle class="fg" cx="9" cy="9" r="${R}" stroke-dasharray="${C}"
        stroke-dashoffset="${C*(1-p)}"/></svg>`;
  }else{
    into.innerHTML='<svg viewBox="0 0 18 18"><circle class="dot" cx="9" cy="9" r="2.8"/></svg>';
  }
  into.onclick=e=>{e.stopPropagation();node.collapsed=false;goTo(node.id)};

  const main=document.createElement('div');main.className='main';
  main.append(tx,m);
  r.append(car,tick,main,into);
  wrap.appendChild(r);

  if(node.note||openId===node.id){
    const nt=document.createElement('div');
    nt.className='note'+(openId===node.id?' edit':'');
    nt.textContent=node.note||'';
    if(openId===node.id){
      nt.contentEditable='true';nt.spellcheck=false;
      nt.dataset.note=node.id;
      if(!node.note)nt.setAttribute('data-ph','1');
      nt.oninput=()=>{node.note=nt.textContent;saveSoon()};
      nt.onclick=e=>e.stopPropagation();
    }
    if(node.note||openId===node.id)wrap.appendChild(nt);
  }

  if(openId===node.id)wrap.appendChild(ctlEl(node,parent,depth));
  if(has&&!node.collapsed){
    const kb=kidsEl(node,depth+1);
    ghost(kb,node);          /* every open branch offers its own next line */
    wrap.appendChild(kb);
  }
  return wrap;
}

function ctlEl(node,parent,depth){
  const c=document.createElement('div');c.className='ctl';
  /* the close sits up at the end of the cue line, well away from the bin.
     two small controls that do very different things should not touch. */
  const shut=document.createElement('button');
  shut.className='shut';shut.innerHTML='&#10005;';
  shut.title='Close';shut.setAttribute('aria-label','Close');
  shut.onmousedown=e=>e.preventDefault();
  shut.onclick=e=>{e.stopPropagation();openId=null;render()};
  c.appendChild(shut);
  /* a tray is a tool, not content. it steps back out of the indentation so it
     sits in the same place whatever depth you are working at. */
  const STEP=26;
  if(depth>1)c.style.marginLeft=(-(depth-1)*STEP)+'px';
  const l1=document.createElement('div');l1.className='line';
  const l2=document.createElement('div');l2.className='line';

  c.append(l1,l2);
  let host=l1;
  const mk=(html,cls,fn,lbl)=>{const b=document.createElement('button');
    b.className='cb '+(cls||'');b.innerHTML=html;
    if(lbl){b.title=lbl;b.setAttribute('aria-label',lbl)}
    b.onmousedown=e=>e.preventDefault();
    b.onclick=e=>{e.stopPropagation();fn()};host.appendChild(b)};
  const pad=document.createElement('div');pad.className='pad';
  [[ICO.out,'Out',()=>run('Tab',true)],[ICO.in,'In',()=>run('Tab',false)],['sp'],
   [ICO.up,'Up',()=>shift(node,parent,-1)],[ICO.down,'Down',()=>shift(node,parent,1)],['sp'],
   ['&#128465;','Delete',()=>{
      const copy=node;
      if(chain(zoom).some(a=>a.id===node.id))zoom=parent.id;   /* walk out first */
      const i=killNode(node,parent);
      openId=null;render();
      offerUndo('Deleted.',()=>{parent.kids.splice(i,0,copy);
        (function un(n){delete GONE[n.id];n.kids.forEach(un)})(copy);
        try{localStorage.setItem('yodo.gone',JSON.stringify(GONE))}catch(e){}})},'bin'],
   ]
   .forEach(([html,lbl,fn,cls])=>{
     if(html==='sp'){pad.appendChild(Object.assign(document.createElement('div'),{className:'sp'}));return}
     const b=document.createElement('button');b.innerHTML=html;b.title=lbl;
     if(cls)b.className=cls;
     b.setAttribute('aria-label',lbl);
     b.onmousedown=e=>e.preventDefault();
     b.onclick=e=>{e.stopPropagation();fn()};pad.appendChild(b)});
  l1.appendChild(pad);
  host=l2;
  const lab2=label(node.when);
  mk('&#9200;', node.urgent?'set urg':'sym',
     ()=>{node.urgent=!node.urgent;render();if(node.urgent)nudgeCue(node)}, 'Urgent');
  mk('Imp',     node.imp?'set':'sym',
     ()=>{node.imp=!node.imp;render();if(node.imp)nudgeCue(node)}, 'Important');
  mk('&#128197;', node.when!=null?('set'+(lab2.cls==='late'?' late':'')):'sym',
     ()=>datePick(node), 'When');
  mk('&#8635;', node.repeat?'set':'sym', ()=>repeatPick(node), 'Repeats');
  mk(swatch(node), node.hue?'set':'sym', ()=>huePick(node), 'Colour');
  return c;
}

/* it asks; it never blocks. a task you cannot save is a task you will not write. */
function nudgeCue(node){
  if(!askCue||node.note)return;
  setTimeout(()=>{
    const nt=document.querySelector('.note[data-note="'+node.id+'"]');
    if(!nt)return;
    nt.focus();
    const r=document.createRange(),sel=getSelection();
    r.selectNodeContents(nt);r.collapse(false);sel.removeAllRanges();sel.addRange(r);
  },70);
}

function shift(node,parent,d){
  const i=parent.kids.indexOf(node),j=i+d;
  if(j<0||j>=parent.kids.length)return;
  parent.kids.splice(i,1);parent.kids.splice(j,0,node);
  render();focus(node.id);
}

/* ---------- outliner keyboard ---------- */
function key(e,node,parent){
  const i=parent.kids.indexOf(node);
  if(e.key==='Enter'){
    e.preventDefault();
    const sel=getSelection(), atStart = sel && sel.anchorOffset===0 && node.t;
    if(atStart){            /* open a line ABOVE; this one drops down with its parts */
      parent.kids.splice(i,0,nd(''));
      openId=node.id;render();focus(node.id);
    }else{
      const f=nd('');parent.kids.splice(i+1,0,f);openId=f.id;render();focus(f.id);
    }
  }
  if((e.key==='ArrowUp'||e.key==='ArrowDown')&&e.shiftKey&&(e.altKey||e.metaKey)){
    e.preventDefault();shift(node,parent,e.key==='ArrowUp'?-1:1);
  }
  if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();
    if(i>0){const up=parent.kids[i-1];parent.kids.splice(i,1);
      up.collapsed=false;up.kids.push(node);render();focus(node.id)}}
  if(e.key==='Tab'&&e.shiftKey){e.preventDefault();
    const gp=find(parent.id).parent;
    if(gp&&parent.id!==here().id){parent.kids.splice(i,1);
      gp.kids.splice(gp.kids.indexOf(parent)+1,0,node);render();focus(node.id)}}
  if((e.key==='ArrowUp'||e.key==='ArrowDown')&&!e.shiftKey&&!e.altKey&&!e.metaKey&&!e.ctrlKey){
    const sel=getSelection();
    const rows=[...document.querySelectorAll('.t[data-id]')];
    const at=rows.findIndex(r=>r.dataset.id===node.id);
    const up=e.key==='ArrowUp';
    /* let the caret move within a wrapped line first; only then change row */
    const box=rows[at].getBoundingClientRect();
    const multi=box.height>parseFloat(getComputedStyle(rows[at]).lineHeight)*1.6;
    if(!multi||(up&&sel.anchorOffset===0)||(!up&&sel.anchorOffset>=(node.t||'').length)){
      const next=rows[at+(up?-1:1)];
      if(next){e.preventDefault();openId=next.dataset.id;render();focus(next.dataset.id)}
      return;
    }
  }
  if(e.key==='Backspace'&&!node.t&&!node.kids.length){e.preventDefault();
    killNode(node,parent);openId=null;render();
    if(parent.kids[i-1])focus(parent.kids[i-1].id)}
}
function run(k,shift){
  const el=document.querySelector('.t:focus')||document.querySelector(`.t[data-id="${openId}"]`);
  if(!el)return;const{node,parent}=find(el.dataset.id);
  key({key:k,shiftKey:shift,preventDefault(){}},node,parent);
}
function focus(id){
  const el=document.querySelector(`.t[data-id="${id}"]`);if(!el)return;
  el.contentEditable='true';el.focus();
  const r=document.createRange(),s=getSelection();
  r.selectNodeContents(el);r.collapse(false);s.removeAllRanges();s.addRange(r);
}

function ghost(host,parent){
  const g=document.createElement('div');g.className='ghost';
  g.innerHTML='<span class="g"><i></i></span><span>'+
    (parent.kids.length ? 'write the next one'
      : (parent.id===ROOT.id ? 'put the first thing down'
         : 'nothing inside yet \u2014 what is the first part?'))+'</span>';
  g.onclick=e=>{e.stopPropagation();
    const f=nd('');parent.kids.push(f);openId=f.id;render();focus(f.id)};
  host.appendChild(g);
}

/* ============================================================
   DO — everything with a date, in time order.
   You cannot restructure here. You can only finish things.
   The roots are shown small and quiet, purely so you know
   where a thing came from.
   ============================================================ */
function ancestry(id){
  return chain(id).slice(1,-1);      /* drop ROOT and the item itself */
}
/* anything you have marked in any way is fair game for Do.
   most things never get a date; that must not exclude them. */
function pickedUp(){
  const out=[];
  (function walk(x){
    x.kids.forEach(k=>{
      if(!isDone(k)&&!k.kids.length&&(k.when!=null||k.urgent||k.imp||k.star))out.push(k);
      if(!isDone(k))walk(k);
    });
  })(ROOT);
  return out;
}
const BY_TIME=[
  ['late', 'overdue',   n=>n.when!=null&&n.when-Date.now()<0],
  ['now',  'today',     n=>{const d=(n.when-Date.now())/DAY;return n.when!=null&&d>=0&&d<1}],
  ['tom',  'tomorrow',  n=>{const d=(n.when-Date.now())/DAY;return n.when!=null&&d>=1&&d<2}],
  ['week', 'this week', n=>{const d=(n.when-Date.now())/DAY;return n.when!=null&&d>=2&&d<7}],
  ['later','later',     n=>{const d=(n.when-Date.now())/DAY;return n.when!=null&&d>=7}],
  ['none', 'no day yet, but marked', n=>n.when==null]
];
/* two flags, four boxes. no scoring, no matrix diagram. */
const BY_WEIGHT=[
  ['late','urgent and important', n=>n.urgent&&n.imp],
  ['now', 'urgent',               n=>n.urgent&&!n.imp],
  ['week','important',            n=>!n.urgent&&n.imp],
  ['later','just dated',          n=>!n.urgent&&!n.imp]
];
let doLens='time';   /* first run only; after that it remembers */
var shut={};         /* which bands you have folded away */

/* if you only do one thing. the rule is fixed and it says what it is. */
function theOne(pool){
  const late=n=>n.when!=null&&n.when-Date.now()<0;
  const today=n=>{const d=(n.when-Date.now())/DAY;return n.when!=null&&d>=0&&d<1};
  const chosen=pool.find(n=>n.pinned);
  if(chosen)return {node:chosen,why:'you chose it'};
  const rules=[
    [n=>late(n)&&n.urgent&&n.imp, 'it is overdue, urgent and important'],
    [n=>late(n)&&n.imp,           'it is overdue, and it matters'],
    [n=>late(n),                  'it is already late'],
    [n=>n.urgent&&n.imp,          'it is both urgent and important'],
    [n=>today(n)&&n.imp,          'it is due today, and it matters'],
    [n=>today(n),                 'it is due today'],
    [n=>n.urgent,                 'you marked it urgent'],
    [n=>n.imp,                    'you marked it important'],
    [n=>n.when!=null,             'it has the nearest day on it']
  ];
  for(const [test,why] of rules){
    const hit=pool.find(test);
    if(hit)return {node:hit,why};
  }
  return pool.length?{node:pool[0],
    why:pool.length===1?'it is the only thing waiting':'nothing else is asking louder'}:null;
}

function renderDo(){
  save();
  document.getElementById('crumbs').innerHTML='';
  document.getElementById('title').textContent='Do';

  const L=document.getElementById('dolist');L.innerHTML='';

  const lens=document.createElement('div');lens.className='lens';
  [['time','by day'],['weight','by weight']].forEach(([k,name])=>{
    const b=document.createElement('button');b.textContent=name;
    b.className=doLens===k?'on':'';
    b.onclick=()=>{doLens=k;save();render()};lens.appendChild(b);
  });
  L.appendChild(lens);

  const pool=pickedUp().sort((a,b)=>(a.when||Infinity)-(b.when||Infinity));

  const one=theOne(pool);
  if(one){
    const h=document.createElement('div');h.className='theone';
    const anc=ancestry(one.node.id).map(a=>a.t).join('  \u203A  ');
    h.innerHTML='<div class="lead">If you only do one thing</div>'+
      (anc?'<div class="oanc">'+anc+'</div>':'')+
      '<div class="otitle">'+one.node.t+'</div>'+
      (one.node.note?'<div class="ocue">\u21B3\u00a0\u00a0'+one.node.note+'</div>':'')+
      '<div class="owhy">because '+one.why+'</div>';
    const act=document.createElement('div');act.className='oact';
    const g=document.createElement('button');g.className='go big';g.textContent='Start it';
    g.onclick=()=>startFocus(one.node);
    const d=document.createElement('button');d.className='cb';d.textContent='Finished it';
    d.onclick=()=>{one.node.done=true;one.node.pinned=false;render()};
    act.append(g,d);
    if(one.node.pinned){
      const un=document.createElement('button');un.className='cb pin on';
      un.textContent='let it choose again';
      un.onclick=()=>{one.node.pinned=false;save();render()};
      act.appendChild(un);
    }
    h.appendChild(act);
    L.appendChild(h);
  }

  if(!pool.length){
    L.insertAdjacentHTML('beforeend','<div class="ghost" style="opacity:.6;cursor:default">'+
      '<span class="g"><i></i></span><span>Nothing picked up yet. In Map, give something '+
      'a day, or mark it urgent or important.</span></div>');
    return;
  }

  let shown=0;
  (doLens==='time'?BY_TIME:BY_WEIGHT).forEach(([cls,name,test])=>{
    const rows=pool.filter(test);
    if(!rows.length)return;
    shown+=rows.length;
    const folded=!!shut[cls];
    const b=document.createElement('div');
    b.className='band'+(cls==='now'?' now':cls==='late'?' late':'')+(folded?' folded':'');
    b.innerHTML='<button class="bandbtn"><span class="fold">\u25BE</span>'+
      '<h2>'+name+'</h2><span class="n">'+rows.length+'</span></button>';
    b.querySelector('.bandbtn').onclick=()=>{shut[cls]=!folded;save();render()};
    L.appendChild(b);
    if(!folded)rows.forEach(n=>L.appendChild(doItem(n)));
  });

  const foot=document.createElement('div');foot.className='foot';
  foot.textContent=shown+' picked up. Mark something urgent, important or dated in Map '+
    'and it appears here.';
  L.appendChild(foot);
}

function doItem(node){
  const w=document.createElement('div');
  w.className='doit'+(isDone(node)?' done':'')+(node.lit?' lit':'');

  const anc=ancestry(node.id);
  if(anc.length){
    const r=document.createElement('div');r.className='roots';
    anc.forEach((a,i)=>{
      const sp=document.createElement('span');sp.className='r';sp.textContent=a.t;
      r.appendChild(sp);
      if(i<anc.length-1){const s2=document.createElement('span');s2.className='s';
        s2.textContent='\u203A';r.appendChild(s2)}
    });
    w.appendChild(r);
  }

  const line=document.createElement('div');line.className='doline';
  const tick=document.createElement('button');
  tick.className='tick';tick.innerHTML=TICK;tick.setAttribute('aria-label','finish');
  if(isDone(node)){tick.style.background='var(--acc)';tick.style.borderColor='var(--acc)';
    tick.querySelector('svg').style.strokeDashoffset='0'}
  tick.onclick=()=>{node.done=!node.done;render()};
  const tx=document.createElement('div');tx.className='dotext';tx.textContent=node.t;
  line.append(tick,tx);
  const fl=[];
  if(node.urgent)fl.push('<span class="mk urg">\u23F1</span>');
  if(node.imp)fl.push('<span class="mk imp">Imp</span>');
  if(node.star)fl.push('<span class="dostar">\u2605</span>');
  if(fl.length){const f=document.createElement('div');f.style.cssText='display:flex;gap:8px;align-items:center';
    f.innerHTML=fl.join('');line.appendChild(f)}
  w.appendChild(line);

  if(node.note){const nn=document.createElement('div');nn.className='donote';
    nn.textContent='\u21B3\u00a0\u00a0'+node.note;w.appendChild(nn)}

  const meta=document.createElement('div');meta.className='dometa';
  const lab=label(node.when);
  if(lab){const d=document.createElement('span');d.className='dodate '+lab.cls;
    d.textContent=lab.txt;meta.appendChild(d)}
  if(!isDone(node)){
    const go=document.createElement('button');go.className='go';go.textContent='Start';
    go.onclick=()=>startFocus(node);meta.appendChild(go);
    const lamp=document.createElement('button');
    lamp.className='lamp'+(node.lit?' on':'');
    lamp.innerHTML=node.lit?'\u25C9':'\u25CE';
    lamp.title=node.lit?'Let it settle back':'Bring it forward';
    lamp.setAttribute('aria-label',lamp.title);
    lamp.onclick=()=>{node.lit=!node.lit;save();render()};
    meta.appendChild(lamp);
    const pin=document.createElement('button');pin.className='cb pin'+(node.pinned?' on':'');
    pin.textContent=node.pinned?'my one thing':'make this my one thing';
    pin.onclick=()=>{const was=node.pinned;
      pickedUp().forEach(n=>n.pinned=false);
      node.pinned=!was;save();render()};
    meta.appendChild(pin);
  }
  w.appendChild(meta);
  return w;
}

document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;openId=null;render()});

/* ---------- focus: 25 minutes, no score kept ---------- */
let fNode=null,fLeft=0,fTimer=null,fRun=false;
let F_LEN=25*60;
function startFocus(node){
  fNode=node;fLeft=F_LEN;fRun=true;
  document.getElementById('f-roots').textContent=
    ancestry(node.id).map(a=>a.t).join('  \u203A  ');
  document.getElementById('f-title').textContent=node.t;
  document.getElementById('focus').classList.add('on');
  paintFocus();
  clearInterval(fTimer);
  fTimer=setInterval(()=>{if(!fRun)return;fLeft--;if(fLeft<=0){fLeft=0;fRun=false}paintFocus()},1000);
}
function paintFocus(){
  const m=String(Math.floor(fLeft/60)).padStart(2,'0'),
        sec=String(fLeft%60).padStart(2,'0');
  document.getElementById('f-clock').textContent=m+':'+sec;
  const C=2*Math.PI*88;
  const arc=document.getElementById('f-arc');
  arc.setAttribute('stroke-dasharray',C);
  arc.setAttribute('stroke-dashoffset',C*(1-fLeft/F_LEN));
  document.getElementById('f-pause').textContent=fRun?'Pause':'Carry on';
}
function endFocus(){clearInterval(fTimer);fRun=false;fNode=null;
  document.getElementById('focus').classList.remove('on');render()}
document.getElementById('f-pause').onclick=()=>{fRun=!fRun;paintFocus()};
document.getElementById('f-quit').onclick=endFocus;
document.getElementById('f-fin').onclick=()=>{if(fNode){fNode.done=true;buzz(22)}endFocus()};

/* ---------- expand / collapse everything ---------- */
let allOpen=false;

document.getElementById('fold').onclick=()=>{
  allOpen=!allOpen;
  (function walk(x){x.kids.forEach(k=>{k.collapsed=!allOpen;walk(k)})})(here());
  render();
};

/* ---------- date ---------- */
const sheet=document.getElementById('sheet'),sin=document.getElementById('sin');
function sheetHead(title){
  return '<div class="grip"></div><div class="shead"><h3>'+title+'</h3>'+
         '<button class="sx" data-shut aria-label="Close">&#10005;</button></div>';
}
function shutSheet(){sheet.classList.remove('on')}
sin.addEventListener('click',e=>{if(e.target.closest('[data-shut]'))shutSheet()});

function datePick(node){
  sin.innerHTML=sheetHead('When will you do it?');
  const o=document.createElement('div');o.className='opts';
  [['Today',0],['Tomorrow',1],['This weekend',(6-new Date().getDay()+7)%7||6],
   ['Next week',7],['In a month',30]].forEach(([l,d])=>{
    const b=document.createElement('button');b.className='opt';b.textContent=l;
    b.onclick=()=>{node.when=at(d);sheet.classList.remove('on');render();nudgeCue(node)};
      o.appendChild(b)});
  if(node.when!=null){const c=document.createElement('button');c.className='opt clear';
    c.textContent='No date';c.onclick=()=>{node.when=null;sheet.classList.remove('on');render()};
    o.appendChild(c)}
  sin.appendChild(o);
  sin.insertAdjacentHTML('beforeend','<div class="lbl">or pick one</div>');
  const inp=document.createElement('input');inp.type='date';
  if(node.when)inp.value=new Date(node.when).toISOString().slice(0,10);
  inp.onchange=()=>{node.when=inp.value?new Date(inp.value+'T18:00:00').getTime():null;
    sheet.classList.remove('on');render()};
  sin.appendChild(inp);sheet.classList.add('on');
}
/* a cue names the moment you will be standing in. a reminder that names only
   the task is the weak kind — it needs the moment too. The question is the
   whole intervention; answering it for them would undo it. */
const HUES={terracotta:'#C2611F',ink:'#2F5D8C',moss:'#3F6B44',
            plum:'#7A3F6B',rose:'#A83A54',ochre:'#9A7B1F'};
function swatch(node){
  return node.hue
    ? '<span class="sw" style="background:'+HUES[node.hue]+'"></span>'
    : '<span class="sw none"></span>';
}
function huePick(node){
  sin.innerHTML=sheetHead('Give it a colour')+
    '<p style="font-size:13px;color:var(--dim);margin-bottom:14px">'+
    'Useful on the lines that hold everything else together.</p>';
  const o=document.createElement('div');o.className='opts';
  const none=document.createElement('button');none.className='opt';none.textContent='Plain';
  none.setAttribute('aria-pressed',!node.hue);
  none.onclick=ev=>{ev.stopPropagation();node.hue=null;sheet.classList.remove('on');render()};
  o.appendChild(none);
  Object.keys(HUES).forEach(k=>{
    const b=document.createElement('button');b.className='opt hue';
    b.innerHTML='<span class="sw" style="background:'+HUES[k]+'"></span>'+k;
    b.setAttribute('aria-pressed',node.hue===k);
    b.onclick=ev=>{ev.stopPropagation();node.hue=k;sheet.classList.remove('on');render()};
    o.appendChild(b)});
  sin.appendChild(o);sheet.classList.add('on');
}
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function repeatPick(node){
  sin.innerHTML=sheetHead('Does it come back?');
  const o=document.createElement('div');o.className='opts';
  ['daily','weekly','monthly'].forEach(r=>{
    const b=document.createElement('button');b.className='opt';b.textContent=r;
    b.setAttribute('aria-pressed',node.repeat===r);
    b.onclick=ev=>{ev.stopPropagation();
      if(node.repeat===r&&r==='daily'){sheet.classList.remove('on');render();return}
      node.repeat=r;
      if(r==='weekly'&&node.rDay==null)node.rDay=new Date().getDay();
      if(r==='monthly'&&node.rDate==null)node.rDate=new Date().getDate();
      if(r==='daily'){sheet.classList.remove('on');render();return}
      repeatPick(node)};
    o.appendChild(b)});
  if(node.repeat){const c=document.createElement('button');c.className='opt clear';c.textContent='Never';
    c.onclick=()=>{node.repeat=null;node.rDay=node.rDate=null;sheet.classList.remove('on');render()};
    o.appendChild(c)}
  sin.appendChild(o);

  if(node.repeat==='weekly'){
    sin.insertAdjacentHTML('beforeend','<div class="lbl">on which day</div>');
    const w=document.createElement('div');w.className='opts';
    WD.forEach((d,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=d;
      b.setAttribute('aria-pressed',node.rDay===i);
      b.onclick=ev=>{ev.stopPropagation();node.rDay=i;
        sheet.classList.remove('on');render()};w.appendChild(b)});
    sin.appendChild(w);
  }
  if(node.repeat==='monthly'){
    sin.insertAdjacentHTML('beforeend','<div class="lbl">on which date</div>');
    const w=document.createElement('div');w.className='opts';w.style.maxHeight='168px';
    w.style.overflowY='auto';
    for(let i=1;i<=31;i++){const b=document.createElement('button');b.className='opt';
      b.style.padding='9px 0';b.style.minWidth='42px';b.textContent=i;
      b.setAttribute('aria-pressed',node.rDate===i);
      b.onclick=ev=>{ev.stopPropagation();node.rDate=i;
        sheet.classList.remove('on');render()};w.appendChild(b)}
    sin.appendChild(w);
  }
  sheet.classList.add('on');
}
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('on')};

/* ---------- look ---------- */
document.getElementById('gear').onclick=()=>{
  sin.innerHTML=sheetHead('Look');
  const row=(title,items,cur,fn)=>{
    sin.insertAdjacentHTML('beforeend','<div class="lbl">'+title+'</div>');
    const o=document.createElement('div');o.className='opts';
    items.forEach(([l,v])=>{const b=document.createElement('button');b.className='opt';b.textContent=l;
      b.setAttribute('aria-pressed',String(cur())===String(v));
      b.onclick=()=>{fn(v);document.getElementById('gear').click()};o.appendChild(b)});
    sin.appendChild(o)};
  row('Paper',[['Warm','paper'],['Cool','light'],['Dark','dark']],
    ()=>document.body.dataset.theme,v=>document.body.dataset.theme=v);
  row('Text size',[['Small',.92],['Normal',1],['Large',1.12]],
    ()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')||1),
    v=>document.documentElement.style.setProperty('--fs',v));
  row('Focus length',[['15 min',900],['25 min',1500],['45 min',2700],['60 min',3600]],
    ()=>F_LEN, v=>{F_LEN=+v});
  row('Typeface',[['Sans',"'Instrument Sans'"],['Serif',"'Newsreader'"]],
    ()=>getComputedStyle(document.documentElement).getPropertyValue('--ff').trim(),
    v=>{document.documentElement.style.setProperty('--ff',v);save()});
  sin.insertAdjacentHTML('beforeend',
    '<div style="font-size:12px;color:var(--faint);margin-top:8px;line-height:1.55">'+
    '<b>Merge</b> folds another device\u2019s backup into this one \u2014 newest change '+
    'per line wins, nothing is lost. <b>Restore</b> replaces everything. '+
    'This device is <code>'+DEVICE+'</code>.</div>');

  sin.insertAdjacentHTML('beforeend','<div class="lbl">Cues</div>');
  const cq=document.createElement('div');cq.className='opts';
  [['Ask me every time',true],['Only when I want to',false]].forEach(([l,v])=>{
    const b=document.createElement('button');b.className='opt';b.textContent=l;
    b.setAttribute('aria-pressed',askCue===v);
    b.onclick=ev=>{ev.stopPropagation();askCue=v;save();document.getElementById('gear').click()};
    cq.appendChild(b)});
  sin.appendChild(cq);
  sin.insertAdjacentHTML('beforeend',
    '<div style="font-size:12.5px;color:var(--faint);margin-top:8px;line-height:1.55">'+
    'When a line gets a day or a mark, the cue field takes the cursor. '+
    'It never stops you saving \u2014 a task you cannot write down is worse than one with no cue.</div>');

  sin.insertAdjacentHTML('beforeend','<div class="lbl">Your list</div>');
  const io=document.createElement('div');io.className='opts';
  const mkio=(label,fn)=>{const b=document.createElement('button');b.className='opt';
    b.textContent=label;b.onclick=ev=>{ev.stopPropagation();fn()};io.appendChild(b)};
  mkio('Back up (.json)',()=>dl('yodo-'+new Date().toISOString().slice(0,10)+'.json',
    JSON.stringify({tree:ROOT,uid,gone:GONE,device:DEVICE,
      saved:new Date().toISOString(),v:2},null,2),'application/json'));
  mkio('As plain text',()=>dl('yodo-'+new Date().toISOString().slice(0,10)+'.txt',
    asText(),'text/plain'));
  mkio('Copy outline',()=>{navigator.clipboard&&navigator.clipboard.writeText(asText())
    .then(()=>toastLine('Copied.'),()=>toastLine('Could not copy.'))});
  mkio('Print / save as PDF',()=>{sheet.classList.remove('on');setTimeout(()=>window.print(),250)});
  mkio('Merge a backup',()=>{
    const f=document.createElement('input');f.type='file';f.accept='.json,application/json';
    f.onchange=()=>{const r=new FileReader();
      r.onload=()=>{try{
        const d=JSON.parse(r.result);
        if(!d||!(d.tree&&d.tree.kids))throw 0;
        const before=JSON.parse(JSON.stringify(ROOT));
        const beforeGone=JSON.parse(JSON.stringify(GONE));
        const out=mergeTrees({tree:ROOT,gone:GONE},{tree:d.tree,gone:d.gone||{}});
        for(const k in ROOT)delete ROOT[k];
        Object.assign(ROOT,out.tree);
        for(const k in GONE)delete GONE[k];
        Object.assign(GONE,out.gone);
        try{localStorage.setItem('yodo.gone',JSON.stringify(GONE))}catch(e){}
        zoom=ROOT.id;openId=null;save();shutSheet();render();
        offerUndo('Merged \u00b7 '+out.stat.fromTheirs+' newer from the file, '+
          out.stat.deleted+' removed',
          'Undo',()=>{for(const k in ROOT)delete ROOT[k];Object.assign(ROOT,before);
            for(const k in GONE)delete GONE[k];Object.assign(GONE,beforeGone);
            save();render()});
      }catch(e){toastLine('That file did not read.')}};
      r.readAsText(f.files[0])};
    f.click()});
  mkio('Restore a backup',()=>{
    const f=document.createElement('input');f.type='file';f.accept='.json,application/json';
    f.onchange=()=>{const r=new FileReader();
      r.onload=()=>{try{
        const d=JSON.parse(r.result);const t=d.tree||d;
        if(!t||!t.kids)throw 0;
        for(const k in ROOT)delete ROOT[k];
        Object.assign(ROOT,t);uid=d.uid||uid;
        zoom=ROOT.id;openId=null;save();sheet.classList.remove('on');render();
        toastLine('Restored.');
      }catch(e){toastLine('That file did not read.')}};
      r.readAsText(f.files[0])};
    f.click()});
  sin.appendChild(io);

  sin.insertAdjacentHTML('beforeend','<div class="lbl">First time</div>');
  const again=document.createElement('div');again.className='opts';
  const a1=document.createElement('button');a1.className='opt';a1.textContent='Show the introduction again';
  a1.onclick=()=>{sheet.classList.remove('on');startIntro()};
  again.appendChild(a1);sin.appendChild(again);
  sin.insertAdjacentHTML('beforeend',
    '<div style="margin-top:22px;font-size:11.5px;color:var(--faint)">Yodo \u00b7 alpha 11</div>');
  const done=document.createElement('button');done.className='sdone';done.textContent='Done';
  done.onclick=shutSheet;sin.appendChild(done);
  sheet.classList.add('on');
};

document.addEventListener('keydown',e=>{
  if((e.key==='z'||e.key==='Z')&&(e.metaKey||e.ctrlKey)&&!e.shiftKey&&undoFn){
    e.preventDefault();undoFn();undoFn=null;
    document.getElementById('undo').classList.remove('on');render();
  }
});
document.addEventListener('click',e=>{
  if(!openId)return;
  /* a node removed by its own handler can no longer be asked where it lives,
     so anything already detached is treated as "inside". */
  if(!e.target.isConnected)return;
  if(sheet.classList.contains('on'))return;
  if(e.target.closest('.ctl')||e.target.closest('.t')||e.target.closest('.ghost')
     ||e.target.closest('.note')||e.target.closest('.sheet')||e.target.closest('.row'))return;
  openId=null;render();
});

/* ============================================================
   FIRST RUN
   Five cards, then three pointers at the real buttons.
   Skippable at any point, and repeatable from Look.
   ============================================================ */
const SLIDES=[
  {m:'\u25CB', h:'Yodo',
   p:'One list, and everything lives in it \u2014 jobs, ideas, projects, the lot. '+
     'You never file anything. Structure turns up on its own.'},
  {m:'\u270E', h:'Write a line. Then another.',
   p:'That is the whole of it to begin with.',
   d:'<b>buy stamps</b><br><span class="k">Enter</span> starts the next line'},
  {m:'\u21B3', h:'Tuck one line under another',
   p:'And the line above quietly becomes a project. Nobody has to say so.',
   d:'<b>Move flat</b><br><span class="ind"><b>book the van</b> &nbsp;<span class="k">Tab</span></span>'},
  {m:'\u25CF', h:'Step inside anything',
   p:'Tap the dot on the right of a line and it becomes the whole screen. '+
     'The trail at the top brings you back.'},
  {m:'\u21B3', h:'Say where you will be',
   p:'A line that knows <b>when and where</b> gets done far more often than one that '+
     'only knows what. Drop a cue: <i>at my desk</i>, <i>in the kitchen</i>, '+
     '<i>on the way home</i>.'},
  {m:'\u21C4', h:'Two ways to look',
   p:'<b>Map</b> is for thinking \u2014 nesting, moving, breaking things down. '+
     '<b>Do</b> is for finishing. Tap the switch at the top, or just '+
     '<b>swipe sideways</b>.'},
  {m:'\u23F1', h:'Then just do things',
   p:'Mark a line <b>\u23F1 urgent</b> or <b>Imp</b>ortant, or give it a day, and it turns up '+
     'in <b>Do</b> \u2014 with one thing at the top, and why it was chosen.'}
];
let slide=0;
function paintIntro(){
  const S=SLIDES[slide];
  document.getElementById('in-card').innerHTML=
    '<div class="mark">'+S.m+'</div><h2>'+S.h+'</h2><p>'+S.p+'</p>'+
    (S.d?'<div class="demo">'+S.d+'</div>':'');
  document.getElementById('in-dots').innerHTML=
    SLIDES.map((_,i)=>'<i class="'+(i===slide?'on':'')+'"></i>').join('');
  document.getElementById('in-next').textContent=
    slide===SLIDES.length-1?'Start':'Next';
}
function startIntro(){slide=0;paintIntro();document.getElementById('intro').classList.add('on')}
function endIntro(goCoach){
  document.getElementById('intro').classList.remove('on');
  try{localStorage.setItem('yodo.seen','1')}catch(e){}
  if(goCoach)setTimeout(()=>startCoach(),350);
}
document.getElementById('in-next').onclick=()=>{
  if(slide<SLIDES.length-1){slide++;paintIntro()}else endIntro(true)};
document.getElementById('in-skip').onclick=()=>endIntro(false);

/* ---------- pointers at the real thing ---------- */
const COACH=[
  {sel:'.ghost', h:'Start here',
   p:'This faint bullet is always at the end of a list. Tap it and write.'},
  {sel:'#modes', h:'Two ways to look',
   p:'<b>Map</b> is for thinking \u2014 nesting, moving, breaking things down. '+
     '<b>Do</b> is for finishing, and nothing else.'},
  {sel:'#gear', h:'Paper, size, typeface',
   p:'And the length of a focus session. This introduction lives here too, '+
     'if you want it again.'}
];
let coachAt=0;
function startCoach(){coachAt=0;document.getElementById('coach').classList.add('on');paintCoach()}
function endCoach(){document.getElementById('coach').classList.remove('on')}
function paintCoach(){
  const C=COACH[coachAt];
  const el=document.querySelector(C.sel);
  if(!el){coachAt++;return coachAt<COACH.length?paintCoach():endCoach()}
  const r=el.getBoundingClientRect(),pad=8;
  const spot=document.getElementById('spot');
  spot.style.left=(r.left-pad)+'px';spot.style.top=(r.top-pad)+'px';
  spot.style.width=(r.width+pad*2)+'px';spot.style.height=(r.height+pad*2)+'px';

  const tip=document.getElementById('tip');
  tip.innerHTML='<h4>'+C.h+'</h4><p>'+C.p+'</p><div class="row2">'+
    '<span class="n">'+(coachAt+1)+' of '+COACH.length+'</span>'+
    '<button class="later" id="c-skip">Not now</button>'+
    '<button id="c-next">'+(coachAt===COACH.length-1?'Done':'Next')+'</button></div>';
  const below=r.bottom+16, above=r.top-16;
  const useBelow = below+150 < window.innerHeight;
  tip.style.top = useBelow ? below+'px' : 'auto';
  tip.style.bottom = useBelow ? 'auto' : (window.innerHeight-above)+'px';
  const w=Math.min(270,window.innerWidth-32);
  tip.style.left=Math.max(16,Math.min(window.innerWidth-w-16,r.left+r.width/2-w/2))+'px';
  tip.style.width=w+'px';
  document.getElementById('c-next').onclick=()=>{
    coachAt++; coachAt<COACH.length?paintCoach():endCoach()};
  document.getElementById('c-skip').onclick=endCoach;
}
window.addEventListener('resize',()=>{
  if(document.getElementById('coach').classList.contains('on'))paintCoach()});

/* ---------- swipe sideways to change mode ---------- */
(function(){
  let x0=0,y0=0,live=false;
  const main=document.querySelector('main');
  main.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const t=e.target;
    /* never steal the gesture from text, the tray, a sheet or a scroller */
    if(t.closest('[contenteditable="true"]')||t.closest('.ctl')||t.closest('.sheet')
       ||t.closest('.pad')||t.closest('.lens')||t.closest('#modes'))return;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;live=true;
  },{passive:true});
  main.addEventListener('touchend',e=>{
    if(!live)return;live=false;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
    const want=dx<0?'do':'map';
    if(want!==mode){mode=want;openId=null;save();render();buzz(8)}
  },{passive:true});
})();

/* ---------- back button: on Android and in the browser ---------- */
function goTo(id,push){
  zoom=id;openId=null;
  if(push!==false)history.pushState({zoom:id,mode},'');
  render();
}
window.addEventListener('popstate',e=>{
  if(document.getElementById('focus').classList.contains('on')){endFocus();return}
  if(sheet.classList.contains('on')){sheet.classList.remove('on');return}
  const st=e.state;
  if(st&&st.zoom&&find(st.zoom)){mode=st.mode||'map';zoom=st.zoom;openId=null;render();return}
  const c=chain(zoom);
  if(c.length>1){zoom=c[c.length-2].id;openId=null;render()}
});
/* every way of going deeper now records a step */
document.addEventListener('DOMContentLoaded',()=>{});
const _oldRender=render;
history.replaceState({zoom,mode},'');

const saved=load();
if(saved&&saved.zoom&&find(saved.zoom)){zoom=saved.zoom;mode=saved.mode||'map'}
render();

/* long-press the home-screen icon: jump straight in */
const q=new URLSearchParams(location.search).get('go');
if(q==='do'){mode='do';render()}
if(q==='new'){setTimeout(()=>{const g=document.querySelector('.ghost');if(g)g.click()},300)}

let seen=false;
try{seen=localStorage.getItem('yodo.seen')==='1'}catch(e){}
if(!seen&&!ROOT.kids.length)setTimeout(startIntro,250);

/* offline */
if('serviceWorker' in navigator)
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
